async function preConnect() {
  if (gattServer != null && gattServer.connected) {
    if (bleDevice != null && bleDevice.gatt.connected) {
      bleDevice.gatt.disconnect();
    }
  }
  else {
    resetVariables();
    try {
      bleDevice = await navigator.bluetooth.requestDevice({
        filters: [{ namePrefix: 'NRF_EPD' }, { namePrefix: 'nrf_epd' }],
        optionalServices: ['62750001-d828-918d-fb46-b6c11c675aec']
      });
    } catch (e) {
      console.error(e);
      if (e.message) addLog("requestDevice: " + e.message);
      addLog("请检查蓝牙是否已开启，且使用的浏览器支持蓝牙！建议使用以下浏览器：");
      addLog("• 电脑: Chrome/Edge");
      addLog("• Android: Chrome/Edge");
      addLog("• iOS: Bluefy 浏览器");
      return;
    }

    await bleDevice.addEventListener('gattserverdisconnected', disconnect);
    setTimeout(async function () { await connect(); }, 300);
  }
}

async function reConnect() {
  if (!bleDevice) {
    addLog("请先用「连接」选择设备");
    return;
  }
  reconnecting = true;
  try {
    if (bleDevice.gatt && bleDevice.gatt.connected) {
      bleDevice.gatt.disconnect();
    }
  } catch (_) {}
  gattServer = null;
  epdService = null;
  epdCharacteristic = null;
  rleSupport = false;
  addLog("正在重连");
  setTimeout(async function () {
    try {
      await connect();
    } finally {
      reconnecting = false;
    }
  }, 1500);
}

function handleNotify(value, idx) {
  const data = new Uint8Array(value.buffer, value.byteOffset, value.byteLength);
  if (data.length >= 5 && data[0] === 0x69 && data[1] === 0x6d && data[2] === 0x3d) {
    if (typeof onImgBinaryChunk === 'function') onImgBinaryChunk(data);
    return;
  }
  if (textDecoder == null) textDecoder = new TextDecoder();
  const msg = textDecoder.decode(data);
  const isText =
    msg.startsWith('flash=') || msg.startsWith('img=') || msg.startsWith('imgr=') ||
    msg.startsWith('mtu=') || msg.startsWith('fwver=') || msg.startsWith('fwid=') ||
    msg.startsWith('device=') || msg.startsWith('t=') || msg.startsWith('vbat=') ||
    msg.startsWith('clean=') || msg.startsWith('holiday=') || msg.startsWith('ble=') ||
    msg.startsWith('spiflash=') || msg.startsWith('calendar_theme=') ||
    msg.startsWith('countdown=') || msg.startsWith('cd=') || msg.startsWith('cdf=') ||
    msg.startsWith('caltile=') || msg.startsWith('calgeom=') ||
    msg.startsWith('hzk=');
  if (idx == 0 && !isText) {
    addLog(`收到配置：${bytes2hex(data)}`);
    const epdpins = document.getElementById("epdpins");
    const epddriver = document.getElementById("epddriver");
    epdpins.value = bytes2hex(data.slice(0, 7));
    if (data.length > 10) epdpins.value += bytes2hex(data.slice(10, 11));
    const keyEl = document.getElementById("epdkeypin");
    if (keyEl && data.length > 8) keyEl.value = String(data[8]);
    epddriver.value = bytes2hex(data.slice(7, 8));
    if (!epddriver.value) epddriver.value = '03';
    updateDitcherOptions();
    return;
  }
  if (!(msg === 'flash=ack' || msg.startsWith('flash=ack:') || msg.startsWith('vbat=') ||
          msg.startsWith('clean=') || msg.startsWith('holiday=') || msg.startsWith('ble=') ||
          msg.startsWith('countdown=') || msg.startsWith('cd=') || msg.startsWith('cdf=') ||
          msg.startsWith('caltile=') || msg.startsWith('calgeom='))) {
      addLog(msg, '⇓');
    }
    if (typeof onFlashNotify === 'function' &&
        (msg.startsWith('flash=') || msg.startsWith('img=') || msg.startsWith('imgr=') ||
         msg.startsWith('hzk=') || msg.startsWith('caltile='))) {
      onFlashNotify(msg);
    }
    if (/^img=\d+,/.test(msg) && typeof applyImgInfoNotify === 'function' && !flashOpActive) {
      applyImgInfoNotify(msg);
    }
    if (msg.startsWith('mtu=') && msg.length > 4) {
      const mtuSize = parseInt(msg.substring(4));
      document.getElementById('mtusize').value = mtuSize;
      if (Number.isFinite(mtuSize) && mtuSize >= 20) negotiatedMaxDataLen = mtuSize;
      addLog(`MTU 已更新为: ${mtuSize}`);
      if (msg.includes('rle=1')) {
        rleSupport = true;
        addLog('已开启 RLE 压缩传输支持');
      }
    } else if (msg.startsWith('t=') && msg.length > 2) {
      const t = parseInt(msg.substring(2)) + new Date().getTimezoneOffset() * 60;
      addLog(`远端时间: ${new Date(t * 1000).toLocaleString()}`);
      addLog(`本地时间: ${new Date().toLocaleString()}`);
    } else if (msg.startsWith('device=') && msg.length > 7) {
      const parts = msg.substring(7).split(',');
      if (parts.length >= 3) {
        deviceInfo.modelId = parseInt(parts[0], 10);
        deviceInfo.width = parseInt(parts[1], 10);
        deviceInfo.height = parseInt(parts[2], 10);
        addLog(`设备信息: 型号=${deviceInfo.modelId}, 尺寸=${deviceInfo.width}x${deviceInfo.height}`);
        setTimeout(() => {
          if (typeof scheduleImgSlotRefresh === 'function') scheduleImgSlotRefresh();
        }, 400);
      }
    } else if (msg.startsWith('fwid=') && msg.length > 5) {
      addLog(`固件标识: ${msg.substring(5)}`);
    } else if (msg.startsWith('spiflash=') && msg.length > 9) {
      const m = /spiflash=(\d+)\s*,\s*jedec=([0-9A-Fa-f]+)/.exec(msg);
      const el = document.getElementById('spiFlashInfo');
      if (m) {
        const bytes = parseInt(m[1], 10);
        const jedec = m[2].toUpperCase();
        deviceInfo.spiFlashSize = bytes;
        deviceInfo.jedec = jedec;
        let human = `${bytes}B`;
        if (bytes >= 1048576 && (bytes % 1048576) === 0) human = `${bytes / 1048576}MB`;
        else if (bytes >= 1024 && (bytes % 1024) === 0) human = `${bytes / 1024}KB`;
        const text = bytes > 0
          ? `SPI Flash：${human}（JEDEC ${jedec}）`
          : `SPI Flash：未检测到（JEDEC ${jedec}）`;
        if (el) {
          el.hidden = false;
          el.textContent = text;
        }
        addLog(text);
      } else if (el) {
        el.hidden = false;
        el.textContent = `SPI Flash：${msg.substring(9)}`;
        addLog(`SPI Flash: ${msg.substring(9)}`);
      }
    } else if (msg.startsWith('fwver=') && msg.length > 6) {
      const m = /fwver\s*=\s*(\d+)\.(\d+)\.(\d+)(?:\s*,\s*(\d+))?/.exec(msg);
      if (m && Number.isFinite(parseInt(m[4], 10))) deviceInfo.fwBuild = parseInt(m[4], 10);
      addLog(`产品版本: ${msg.substring(6)}`);
    } else if (msg.startsWith('vbat=') && msg.length > 5) {
      const mv = parseInt(msg.substring(5), 10);
      if (Number.isFinite(mv)) {
        deviceInfo.voltageMv = mv;
        addLog(`电池电压: ${(mv / 1000).toFixed(2)}V (${mv} mV)`);
      }
    } else if (msg.startsWith('clean=')) {
      const phase = msg.substring(6);
      const map = { black: '全黑', white: '全白', red: '全红' };
      addLog(`水印清洗: ${map[phase] || phase}`);
    } else if (msg.startsWith('holiday=')) {
      applyHolidayStatus(msg);
      if (msg.startsWith('holiday=part,')) {
        addLog(`调休传输: ${msg.substring(13)}`);
      } else if (msg.startsWith('holiday=bad')) {
        addLog('调休写入失败');
      } else {
        const m = /^holiday=(\d+),(\d+),src=(\w+)/.exec(msg);
        if (m) addLog(`调休: ${m[1]}年 ${m[2]}天 (${m[3] === 'user' ? '已导入' : '固件默认'})`);
      }
    } else if (msg.startsWith('ble=')) {
      const on = msg.substring(4) === '1';
      applyBleAlwaysOn(on);
      addLog(on ? '蓝牙模式: 常开' : '蓝牙模式: 常关');
    } else if (msg.startsWith('calendar_theme=')) {
      const value = msg.substring(15);
      deviceInfo.calTheme = true;
      setCalendarThemeSelect(value);
      const labels = { '0': '简单日历', '1': '增强日历' };
      addLog(`日历主题: ${labels[value] || value}`);
    } else if (msg.startsWith('countdown=')) {
      addLog(`自定义倒数日: ${msg.substring(10)} 条`);
      resetCountdownRows();
      clearFocusForm();
    } else if (msg.startsWith('cdf=')) {
      applyFocusItem(msg.substring(4));
    } else if (msg.startsWith('cd=')) {
      applyCountdownItem(msg.substring(3));
    } else if (msg.startsWith('calgeom=') || msg.startsWith('caltile=')) {
      if (typeof calBgOnNotify === 'function') calBgOnNotify(msg);
    }
}

async function connect() {
  if (bleDevice == null || epdCharacteristic != null) return;

  try {
    addLog("正在连接: " + bleDevice.name);
    let lastErr = null;
    for (let attempt = 0; attempt < 4; attempt++) {
      try {
        if (attempt > 0) {
          addLog("重试连接 (" + (attempt + 1) + "/4)");
          await sleepMs(700 * attempt);
        }
        if (bleDevice.gatt && bleDevice.gatt.connected) {
          try { bleDevice.gatt.disconnect(); } catch (_) {}
          await sleepMs(400);
        }
        gattServer = await bleDevice.gatt.connect();
        addLog('  找到 GATT Server');
        if (!gattServer || !bleDevice.gatt.connected) {
          throw new Error('GATT Server is disconnected. Cannot retrieve services.');
        }
        epdService = await gattServer.getPrimaryService('62750001-d828-918d-fb46-b6c11c675aec');
        addLog('  找到 EPD Service');
        epdCharacteristic = await epdService.getCharacteristic('62750002-d828-918d-fb46-b6c11c675aec');
        addLog('  找到 Characteristic');
        lastErr = null;
        break;
      } catch (e) {
        lastErr = e;
        epdCharacteristic = null;
        epdService = null;
        gattServer = null;
        if (e && e.message) addLog("connect: " + e.message);
      }
    }
    if (lastErr || !epdCharacteristic) {
      throw lastErr || new Error('GATT 连接失败');
    }
  } catch (e) {
    console.error(e);
    if (e.message) addLog("connect: " + e.message);
    if (!reconnecting) disconnect();
    return;
  }

  try {
    const versionCharacteristic = await epdService.getCharacteristic('62750003-d828-918d-fb46-b6c11c675aec');
    const versionData = await versionCharacteristic.readValue();
    appVersion = versionData.getUint8(0);
    addLog(`固件版本: 0x${appVersion.toString(16)}`);
    if (typeof noteImgMultiFromAppVersion === 'function') {
      noteImgMultiFromAppVersion(appVersion);
    }
  } catch (e) {
    console.error(e);
    appVersion = 0x15;
  }

  if (appVersion < 0x16) {
    const oldURL = "https://tsl0922.github.io/EPD-nRF5/v1.5";
    await appAlert('当前固件版本过低，可能无法正常使用部分功能，建议升级到最新版本。', '注意');
    if (await appConfirm('是否访问旧版本上位机？', '固件过旧')) location.href = oldURL;
    setTimeout(() => {
      addLog(`如遇到问题，可访问旧版本上位机: ${oldURL}`);
    }, 500);
  }

  try {
    epdCharacteristic.removeEventListener('characteristicvaluechanged', onEpdCharacteristicNotify);
    epdCharacteristic.addEventListener('characteristicvaluechanged', onEpdCharacteristicNotify);
    await epdCharacteristic.startNotifications();
  } catch (e) {
    console.error(e);
    if (e.message) addLog("startNotifications: " + e.message);
  }

  await write(EpdCmd.INIT);
  await sleepMs(500);
  if (deviceInfo.calTheme) await write(EpdCmd.COUNTDOWN);
  if (typeof calBgOnConnected === 'function') {
    calBgOnConnected().catch(() => {});
  }
  if (typeof scheduleImgSlotRefresh === 'function') {
    imgSlotRefreshAttempts = 0;
    scheduleImgSlotRefresh();
  }

  document.getElementById("connectbutton").innerHTML = '断开';
  updateButtonStatus();
}

function addLog(logTXT, action = '') {
  const log = document.getElementById("log");
  const now = new Date();
  const time = String(now.getHours()).padStart(2, '0') + ":" +
    String(now.getMinutes()).padStart(2, '0') + ":" +
    String(now.getSeconds()).padStart(2, '0') + " ";

  const logEntry = document.createElement('div');
  const timeSpan = document.createElement('span');
  logEntry.className = 'log-line';
  timeSpan.className = 'time';
  timeSpan.textContent = time;
  logEntry.appendChild(timeSpan);

  if (action !== '') {
    const actionSpan = document.createElement('span');
    actionSpan.className = 'action';
    actionSpan.innerHTML = action;
    logEntry.appendChild(actionSpan);
  }
  logEntry.appendChild(document.createTextNode(logTXT));

  log.appendChild(logEntry);
  log.scrollTop = log.scrollHeight;

  while (log.childNodes.length > 20) {
    log.removeChild(log.firstChild);

function fillCanvas(style) {

function updateImage() {
  const imageFile = document.getElementById('imageFile');

  const image = new Image();
  image.onload = function () {
    URL.revokeObjectURL(this.src);

      if (cropManager.isCropMode()) cropManager.exitCropMode();
      ctx.drawImage(image, 0, 0, image.width, image.height, 0, 0, canvas.width, canvas.height);
      convertDithering();
    } else {
      appAlert('图片宽高比例与画布不匹配，将进入裁剪模式。\n请放大图片后移动图片使其充满画布，再点击「完成」。', '裁剪');
      paintManager.setActiveTool(null, '');

function rotateImageDataCounterclockwise(imageData) {
  const width = imageData.width;
  const height = imageData.height;
  const data = imageData.data;
  const rotatedImageData = new ImageData(height, width);
  const rotatedData = rotatedImageData.data;

  // (x, y) -> (y, width - 1 - x)
  for (let y = 0; y < height; y++) {
    for (let x = 0; x < width; x++) {
      const srcIndex = (y * width + x) * 4;
      const dstX = y;
      const dstY = width - 1 - x;
      const dstIndex = (dstY * height + dstX) * 4;
      rotatedData[dstIndex] = data[srcIndex];
      rotatedData[dstIndex + 1] = data[srcIndex + 1];
      rotatedData[dstIndex + 2] = data[srcIndex + 2];
      rotatedData[dstIndex + 3] = data[srcIndex + 3];
    }
  }
  return rotatedImageData;
}

function imageDataForPanel(imageData) {

  const selectedSize = canvasSizes.find(size => size.name === selectedSizeName);
  if (selectedSize && imageData.width === selectedSize.height && imageData.height === selectedSize.width) {
    addLog(`画布已旋转为 ${imageData.width}x${imageData.height}，发送前纠正回 ${selectedSize.width}x${selectedSize.height}`);
    return rotateImageDataCounterclockwise(imageData);
  }
  if (selectedSize && (imageData.width !== selectedSize.width || imageData.height !== selectedSize.height)) {
    addLog(`警告：画布尺寸异常(${imageData.width}x${imageData.height})，当前应为 ${selectedSize.width}x${selectedSize.height}`);
  }
  return imageData;
}

function rotateCanvas() {
  if (!canvas || !ctx) {
    addLog("画布未初始化，无法旋转");
    return;
  }
  if (cropManager && cropManager.isCropMode()) {
    addLog("请先完成图片裁剪再旋转");
    return;
  }

  const currentWidth = canvas.width;
  const currentHeight = canvas.height;
  const oldTextElements = JSON.parse(JSON.stringify(paintManager.textElements));
  const oldLineSegments = JSON.parse(JSON.stringify(paintManager.lineSegments));
  const imageData = ctx.getImageData(0, 0, currentWidth, currentHeight);

  const tempCanvas = document.createElement('canvas');
  tempCanvas.width = currentWidth;
  tempCanvas.height = currentHeight;
  const tempCtx = tempCanvas.getContext('2d');
  tempCtx.putImageData(imageData, 0, 0);

  tempCtx.fillStyle = 'white';
  oldTextElements.forEach((text) => {
    tempCtx.font = text.font;
    const textWidth = tempCtx.measureText(text.text).width;
    const fontSizeMatch = text.font.match(/(\d+)px/);
    const fontSize = fontSizeMatch ? parseInt(fontSizeMatch[1], 10) : 14;
    const textHeight = fontSize * 1.2;
    tempCtx.fillRect(text.x - 2, text.y - textHeight - 2, textWidth + 4, textHeight + 4);
  });
  oldLineSegments.forEach((segment) => {
    tempCtx.strokeStyle = 'white';
    tempCtx.lineWidth = segment.size + 2;
    tempCtx.beginPath();
    if (segment.type === 'dot') {
      tempCtx.moveTo(segment.x, segment.y);
      tempCtx.lineTo(segment.x + 0.1, segment.y + 0.1);
    } else {
      tempCtx.moveTo(segment.x1, segment.y1);
      tempCtx.lineTo(segment.x2, segment.y2);
    }
    tempCtx.stroke();
  });

  canvas.width = currentHeight;
  canvas.height = currentWidth;

  ctx.fillStyle = 'white';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  ctx.save();
  ctx.translate(canvas.width / 2, canvas.height / 2);
  ctx.rotate(Math.PI / 2);
  ctx.drawImage(tempCanvas, -currentWidth / 2, -currentHeight / 2);
  ctx.restore();

  // Clockwise 90: (x, y) -> (height - y, x)
  paintManager.textElements.forEach((text, index) => {
    const oldX = oldTextElements[index].x;
    const oldY = oldTextElements[index].y;
    text.x = currentHeight - oldY;
    text.y = oldX;
  });
  paintManager.lineSegments.forEach((segment, index) => {
    if (segment.type === 'dot') {
      const oldX = oldLineSegments[index].x;
      const oldY = oldLineSegments[index].y;
      segment.x = currentHeight - oldY;
      segment.y = oldX;
    } else {
      const oldX1 = oldLineSegments[index].x1;
      const oldY1 = oldLineSegments[index].y1;
      const oldX2 = oldLineSegments[index].x2;
      const oldY2 = oldLineSegments[index].y2;
      segment.x1 = currentHeight - oldY1;
      segment.y1 = oldX1;
      segment.x2 = currentHeight - oldY2;
      segment.y2 = oldX2;
    }
  });

  paintManager.redrawTextElements();
  paintManager.redrawLineSegments();
  paintManager.saveToHistory();

  addLog(`画布已顺时针旋转: ${currentWidth}x${currentHeight} -> ${canvas.width}x${canvas.height}`);
}

async function clearCanvas() {
  if (!await appConfirm('清除画布内容？', '清除画布')) return false;
  fillCanvas('white');
  paintManager.clearElements();
  if (cropManager.isCropMode()) cropManager.exitCropMode();
  paintManager.saveToHistory();
  return true;
}

function convertDithering() {
  paintManager.redrawTextElements();
  paintManager.redrawLineSegments();

  const contrast = parseFloat(document.getElementById('ditherContrast').value);
  const currentImageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
  const imageData = new ImageData(
    new Uint8ClampedArray(currentImageData.data),
    currentImageData.width,
    currentImageData.height
  );

  adjustContrast(imageData, contrast);

  const alg = document.getElementById('ditherAlg').value;
  const strength = parseFloat(document.getElementById('ditherStrength').value);
  const mode = document.getElementById('ditherMode').value;
  const processedData = processImageData(ditherImage(imageData, alg, strength, mode), mode);
  const finalImageData = decodeProcessedData(processedData, canvas.width, canvas.height, mode);
  ctx.putImageData(finalImageData, 0, 0);

  paintManager.saveToHistory(); // Save dithered image to history
}

function applyDither() {
  cropManager.finishCrop(() => convertDithering());
}

function initEventHandlers() {
  document.getElementById("ditherStrength").addEventListener("input", (e) => {
    document.getElementById("ditherStrengthValue").innerText = parseFloat(e.target.value).toFixed(1);
    applyDither();
  });
  document.getElementById("ditherContrast").addEventListener("input", (e) => {
    document.getElementById("ditherContrastValue").innerText = parseFloat(e.target.value).toFixed(1);
    applyDither();
  });
}

function checkDebugMode() {
  const link = document.getElementById('debug-toggle');
  const urlParams = new URLSearchParams(window.location.search);
  const debugMode = urlParams.get('debug');

  if (debugMode === 'true') {
    document.body.classList.add('dark-mode');
    link.innerHTML = '正常模式';
    link.setAttribute('href', window.location.pathname);
    addLog("注意：开发模式功能已开启！不懂请不要随意修改，否则后果自负！");
  } else {
    document.body.classList.remove('dark-mode');
    link.innerHTML = '开发模式';
    link.setAttribute('href', window.location.pathname + '?debug=true');
  }
}

document.body.onload = () => {
  textDecoder = null;
  canvas = document.getElementById('canvas');
  ctx = canvas.getContext("2d");

  ctx.fillStyle = 'white';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  paintManager.initPaintTools();
  cropManager.initCropTools();
  initAppModal();
  initCountdownRows();
  initEventHandlers();
  updateButtonStatus();
  checkDebugMode();
}

        img.data[o] = 255; img.data[o + 1] = 0; img.data[o + 2] = 0; img.data[o + 3] = 255;

        img.data[o] = 0; img.data[o + 1] = 0; img.data[o + 2] = 0; img.data[o + 3] = 255;

  if (!imgMultiSupported) setImgMultiUiVisible(true);
  const parts = msg.slice(4).split(',');
  imgSlotCount = parseInt(parts[0], 10) || 0;
  if (imgSlotCount > 0) {
    imgSlotRefreshAttempts = 0;
    if (imgSlotRefreshTimer) {
      clearTimeout(imgSlotRefreshTimer);
      imgSlotRefreshTimer = null;
    }
  }
  imgMaskParseHex(parts[1] || '00', imgSlotCount);
  if (parts.length >= 5) {
    const st = parseInt(parts[4], 10);
    if (Number.isFinite(st) && st > 0) imgSlotStride = st;
  }
  imgCarouselApplyDeviceMinutes(parseInt(parts[2], 10) || 0);
  if (parts.length >= 4) {
    const cur = parseInt(parts[3], 10);
    imgCurrentSlot = (Number.isFinite(cur) && cur >= 0 && cur < imgSlotCount) ? cur : 0xFF;
  }
  if (parts.length >= 6) imgCarouselApplyDeviceMode(parseInt(parts[5], 10) || 0);
  if (imgSelectedSlotIdx >= imgSlotCount) imgSelectedSlotIdx = 0;
  imgCollapseTrailingEmpty();
  imgUpdateSlotSelect();
  return true;
}

function waitFlashNotify(prefix, timeoutMs = 120000, altPrefix = null, opts = null) {
  return new Promise((resolve, reject) => {
    if (flashNotifyWait) {
      const prev = flashNotifyWait;
      flashNotifyWait = null;
      try {
        if (prev._timer) clearTimeout(prev._timer);
        prev.reject(new Error('cancelled'));
      } catch (_) {}
    }
    let timer = null;
    const arm = () => {
      if (timer) clearTimeout(timer);
      timer = setTimeout(() => {
        if (flashNotifyWait && flashNotifyWait.reject === reject) flashNotifyWait = null;
        reject(new Error(`等待 ${prefix} 超时`));
      }, timeoutMs);
      if (flashNotifyWait && flashNotifyWait.reject === reject) flashNotifyWait._timer = timer;
    };
    flashNotifyWait = {
      prefix, altPrefix,
      match: opts && opts.match ? opts.match : null,
      ignore: opts && opts.ignore ? opts.ignore : null,
      bump: arm, _timer: null,
      resolve: (msg) => { clearTimeout(timer); flashNotifyWait = null; resolve(msg); },
      reject,
    };
    arm();
  });
}

function onFlashNotify(msg) {
  if (msg.startsWith('flash=busy') || msg.startsWith('flash=wait')) flashBusyFlag = true;
  if (msg === 'flash=ack' || msg.startsWith('flash=ack:')) flashAckCredits += 1;
  if (msg.startsWith('flash=err') || msg.startsWith('flash=busy') || msg.startsWith('flash=wait')) {
    flashAckError = msg;
  }
  if (!flashNotifyWait) return;
  if (msg.startsWith('flash=erase') || msg.startsWith('flash=verify') || msg.startsWith('flash=wait')) {
    flashNotifyWait.bump && flashNotifyWait.bump();
    return;
  }
  if (flashNotifyWait.ignore && flashNotifyWait.ignore(msg)) {
    flashNotifyWait.bump && flashNotifyWait.bump();
    return;
  }
  if (msg === 'img=queued') {
    flashNotifyWait.bump && flashNotifyWait.bump();
    return;
  }
  if (flashNotifyWait.match) {
    if (flashNotifyWait.match(msg)) flashNotifyWait.resolve(msg);
    return;
  }
  if (msg.startsWith(flashNotifyWait.prefix) ||
      (flashNotifyWait.altPrefix && msg.startsWith(flashNotifyWait.altPrefix))) {
    flashNotifyWait.resolve(msg);
  }
}

let xferBarHost = 'main';
let imgReadSkipProgress = false;

function setXferBarHost(host) {
  xferBarHost = (host === 'cal') ? 'cal' : 'main';
}

function setTransferProgress(pct, text, opts = null) {
  const barOnly = !!(opts && opts.barOnly);
  const host = (opts && opts.host) || xferBarHost;
  const cal = host === 'cal';
  if (text != null && !barOnly && typeof setStatus === 'function' && !cal) setStatus(text);
  const bar = document.getElementById(cal ? 'calBgXferBar' : 'xferBar');
  const fill = document.getElementById(cal ? 'calBgXferBarFill' : 'xferBarFill');
  const otherBar = document.getElementById(cal ? 'xferBar' : 'calBgXferBar');
  const otherFill = document.getElementById(cal ? 'xferBarFill' : 'calBgXferBarFill');
  const calText = document.getElementById('calBgXferText');
  if (otherBar) otherBar.hidden = true;
  if (otherFill) otherFill.style.width = '0%';
  if (!cal && calText) {
    calText.hidden = true;
    calText.textContent = '';
  }
  if (cal && calText) {
    if (pct == null) {
      calText.hidden = true;
      calText.textContent = '';
    } else if (text != null && !barOnly) {
      calText.hidden = false;
      calText.textContent = text;
    }
  }
  if (!bar || !fill) return;
  if (bar.parentElement && bar.parentElement.classList.contains('transfer-status')) {
    bar.parentElement.style.display = 'block';
  }
  if (pct == null) {
    bar.hidden = true;
    fill.style.width = '0%';
    xferProgressLast.send = -1;
    return;
  }
  bar.hidden = false;
  let v = Math.max(0, Math.min(100, Number(pct) || 0));
  if (opts && opts.reset) xferProgressLast.send = -1;
  if (xferProgressLast.send >= 0 && v < xferProgressLast.send) v = xferProgressLast.send;
  xferProgressLast.send = v;
  fill.style.width = `${v}%`;
}

function clearTransferProgress(text) {
  setTransferProgress(null, text == null ? '空闲' : text);
}

async function imgRefreshInfo(opts = null) {
  const auto = !!(opts && opts.auto);
  const quiet = !!(opts && (opts.quiet || auto));
  if (auto) {
    if (!imgIsConnected() || !imgMultiSupported) return;
  } else if (typeof checkBluetoothConnection === 'function' && !checkBluetoothConnection()) {
    return;
  }
  if (flashOpActive || (typeof epdSending !== 'undefined' && epdSending) ||
      imgReadBusy || (typeof calBgLoading !== 'undefined' && calBgLoading)) {
    if (auto && imgSlotRefreshAttempts < 8) scheduleImgSlotRefresh();
    return;
  }
  if (imgSlotRefreshInFlight) {
    if (auto) return;
  }
  imgSlotRefreshInFlight = true;
  const keepSlot = (opts && opts.keepSlot != null) ? opts.keepSlot : imgSelectedSlotIdx;
  const forceSlot = (opts && opts.forceSlot != null) ? opts.forceSlot : -1;
  if (imgSlotCount <= 0) {
    const hint = document.getElementById('imgSlotHint');
    if (hint) hint.textContent = imgSlotHintPlaceholder();
  }
  if (!quiet) setStatus('刷新槽位…');
  const timeoutMs = auto ? 20000 : (quiet ? 8000 : 12000);
  const p = waitFlashNotify('img=', timeoutMs, null, {
    match: (msg) => /^img=\d+,/.test(msg),
    ignore: (msg) =>
      msg === 'img=ok' || msg === 'img=busy' || msg === 'img=err' ||
      msg === 'img=del' || msg === 'img=empty' || msg === 'img=car' ||
      msg === 'img=queued',
  });
  try {
    if (!await write(EpdCmd.IMG_INFO, null, true)) {
      throw new Error('读取槽位命令发送失败');
    }
    const msg = await p;
    applyImgInfoNotify(msg);
    if (imgSlotCount > 0) imgSlotRefreshAttempts = 0;
    if (forceSlot >= 0) {
      imgMaskSet(forceSlot, true);
      imgUpdateSlotSelect();
    }
    if (Number.isFinite(keepSlot) && keepSlot >= 0 && keepSlot < imgSlotCount) {
      imgSelectedSlotIdx = keepSlot;
      imgUpdateSlotSelect();
    }
    addLog(`图片槽位：${msg}`);
    if (!quiet) setStatus('空闲');
    if (auto && imgIsConnected() && imgSlotCount <= 0 && imgSlotRefreshAttempts < 8) {
      imgSlotRefreshAttempts += 1;
      const hint = document.getElementById('imgSlotHint');
      if (hint) hint.textContent = imgSlotHintPlaceholder();
      scheduleImgSlotRefresh();
    } else if (auto && imgSlotCount <= 0) {
      const hint = document.getElementById('imgSlotHint');
      if (hint) hint.textContent = '未检测到图片槽（Flash 未就绪）';
    }
  } catch (e) {
    if (!quiet) setStatus('空闲');
    if (auto && imgIsConnected() && imgSlotCount <= 0 && imgSlotRefreshAttempts < 8) {
      imgSlotRefreshAttempts += 1;
      scheduleImgSlotRefresh();
    }
    if (String(e.message || e) !== 'cancelled') addLog(e.message || String(e));
  } finally {
    imgSlotRefreshInFlight = false;
  }
}

async function imgShowSlot() {
  if (typeof checkBluetoothConnection === 'function' && !checkBluetoothConnection()) return;
  const slot = imgSelectedSlot();
  setStatus(`显示槽位 ${imgSlotNo(slot)}`);
  const deadline = Date.now() + 120000;
  try {
    while (Date.now() < deadline) {
      const p = waitFlashNotify('img=ok', 120000, null, {
        match: (msg) => msg === 'img=ok' || msg === 'img=empty' || msg === 'img=err' || msg === 'img=busy',
        ignore: (msg) => msg === 'img=queued' || /^img=\d+,/.test(msg),
      });
      if (!await write(EpdCmd.IMG_SHOW, [slot], true)) return;
      const msg = await p;
      if (msg === 'img=busy') {
        await sleepMs(800);
        continue;
      }
      addLog(msg);
      if (msg === 'img=ok') {
        imgCurrentSlot = slot;
        imgUpdateSlotSelect();
      }
      setStatus(msg === 'img=ok' ? `槽位 ${imgSlotNo(slot)} 已显示` : msg);
      return;
    }
  } catch (e) {
    if (String(e.message || e) !== 'cancelled') addLog(e.message || String(e));
  }
}

async function imgDeleteSlot() {
  if (typeof checkBluetoothConnection === 'function' && !checkBluetoothConnection()) return;
  const slot = imgSelectedSlot();
  if (!await appConfirm(`确定删除槽位 ${imgSlotNo(slot)} 的图片？此操作不可恢复。`, '删除图片')) return;
  const p = waitFlashNotify('img=', 30000, null, {
    match: (msg) => msg === 'img=del' || msg === 'img=err' || msg === 'img=busy',
  });
  if (!await write(EpdCmd.IMG_DELETE, [slot], true)) return;
  try {
    addLog(await p);
    delete imgSlotPayloadCache[slot];
    imgMaskSet(slot, false);
    imgCollapseTrailingEmpty();
    await imgRefreshInfo({ keepSlot: slot, quiet: true });
    imgUpdateSlotSelect();
  } catch (e) {
    addLog(e.message || String(e));
  }
}

async function imgClearAllSlots() {
  if (typeof checkBluetoothConnection === 'function' && !checkBluetoothConnection()) return;
  if (imgSlotCount <= 0) await imgRefreshInfo();
  const used = imgMaskUsedSlots();
  if (used.length === 0) {
    await appAlert('当前没有已占用的图片槽位', '清空全部');
    return;
  }
  if (!await appConfirm(`确定清空全部 ${used.length} 个已占用槽位的图片？此操作不可恢复。`, '清空全部')) return;
  for (const slot of used) {
    const p = waitFlashNotify('img=', 30000, null, {
      match: (msg) => msg === 'img=del' || msg === 'img=err' || msg === 'img=busy',
    });
    if (!await write(EpdCmd.IMG_DELETE, [slot], true)) break;
    try {
      addLog(await p);
      delete imgSlotPayloadCache[slot];
      imgMaskSet(slot, false);
    } catch (e) {
      addLog(e.message || String(e));
      break;
    }
  }
  imgSelectedSlotIdx = 0;
  imgSlotUiShow = 1;
  await imgRefreshInfo({ keepSlot: 0, quiet: true });
}

async function imgSetCarousel() {
  if (typeof checkBluetoothConnection === 'function' && !checkBluetoothConnection()) return;
  if (!imgMultiSupported) {
    await appAlert('当前固件不支持图片轮播，请升级固件。', '不支持');

  }

  if (v > 0) mins = (imgCarouselUnit() === 'hour') ? (v * 60) : v;
  if (mins !== 0 && mins < 5) {
    await appAlert('轮播间隔最小为 5 分钟（填 0 可关闭）', '值无效');
    return;
  }
  if (mins > 240) mins = 240;
  const mode = imgCarouselMode();
  const p = waitFlashNotify('img=car', 5000);

function parseImgrStart(msg) {
  const m = /imgr=start,(\d+),(\d+)(?:,(\d+))?/.exec(String(msg || ''));
  if (!m) return { slot: -1, len: 0, offBytes: 0 };
  const slot = parseInt(m[1], 10);
  const len = parseInt(m[2], 10);
  const hdr = m[3] != null ? parseInt(m[3], 10) : NaN;
  return {
    slot: Number.isFinite(slot) ? slot : -1,
    len: Number.isFinite(len) ? len : 0,
    offBytes: hdr === 3 ? 3 : 0,
  };
}

function parseImgReadChunk(data, offBytes) {
  if (offBytes === 3 && data.length >= 6) {
    return { off: data[3] | (data[4] << 8) | (data[5] << 16), chunk: data.slice(6) };
  }
  return { off: data[3] | (data[4] << 8), chunk: data.slice(5) };
}

function imgReadCleanupWait(ownedWait) {
  if (flashNotifyWait && flashNotifyWait === ownedWait) {
    const prev = flashNotifyWait;
    flashNotifyWait = null;
    try {
      if (prev._timer) clearTimeout(prev._timer);
    } catch (_) {}
  }
  imgReadAccept = false;
  imgReadBuf = null;
  imgReadResolve = null;
  imgReadReject = null;
}

function onImgBinaryChunk(data) {
  if (!imgReadAccept || !imgReadBuf || data.length < 5) return;
  const parsed = parseImgReadChunk(data, imgReadOffBytes === 3 ? 3 : 2);
  const off = parsed.off;
  const chunk = parsed.chunk;
  if (!chunk.length || off + chunk.length > imgReadBuf.length) return;
  imgReadBuf.set(chunk, off);
  const filled = off + chunk.length;
  if (filled > imgReadGot) imgReadGot = filled;
  if (imgReadExpect > 0) {
    const done = Math.min(imgReadExpect, imgReadGot);
    const step = Math.max(512, Math.floor(imgReadExpect / 40));
    if (done === imgReadExpect || done - (onImgBinaryChunk._progAt || 0) >= step) {
      onImgBinaryChunk._progAt = done;
      if (!imgReadSkipProgress) {
        setTransferProgress((done / imgReadExpect) * 100, null, { barOnly: true });
      }
    }
  }
}

async function imgReadSlotPayload(slot, label, opts) {
  const skipUi = !!(opts && opts.skipUi);
  imgReadSkipProgress = skipUi;
  imgReadProgressLabel = label || `读取槽${imgSlotNo(slot)}`;
  if (!skipUi) setTransferProgress(0, `${imgReadProgressLabel}…`, { reset: true });
  const fallbackW = (typeof deviceInfo !== 'undefined' && deviceInfo.width) || 400;
  const fallbackH = (typeof deviceInfo !== 'undefined' && deviceInfo.height) || 300;
  const guess = Math.ceil(fallbackW / 8) * fallbackH * 2;
  const t0 = Date.now();
  try {
    for (let attempt = 0; attempt < 40; attempt++) {
      imgReadAccept = false;
      imgReadOffBytes = (typeof deviceInfo !== 'undefined' && Number(deviceInfo.fwBuild) >= 68) ? 3 : 2;
      imgReadExpect = 0;
      imgReadBuf = new Uint8Array(Math.max(guess, 32768));
      imgReadBuf.fill(0xFF);
      imgReadGot = 0;
      onImgBinaryChunk._progAt = 0;
      let ownedWait = null;
      const ownWait = (p) => {
        ownedWait = flashNotifyWait;
        return p;
      };
      const firstP = ownWait(waitFlashNotify('imgr=', 20000, null, {
        match: (msg) =>
          msg.startsWith('imgr=start') || msg.startsWith('imgr=err') ||
          msg === 'img=empty' || msg === 'img=busy',
        ignore: (msg) => msg === 'imgr=ok' || String(msg).startsWith('imgr=ok'),
      }));
      try {
        if (!await write(EpdCmd.IMG_READ, [slot, 0x01], true)) throw new Error('读取命令发送失败');
        let nextP = firstP;
        const deadline = Date.now() + 180000;
        while (Date.now() < deadline) {
          const msg = await nextP;
          nextP = null;
          if (msg === 'img=busy') {
            const busyErr = new Error('busy');
            busyErr._imgBusy = true;
            throw busyErr;
          }
          if (msg === 'img=empty') throw new Error('槽位为空');
          if (msg && String(msg).startsWith('imgr=err')) throw new Error(msg);
          if (msg && String(msg).startsWith('imgr=start')) {
            const start = parseImgrStart(msg);
            if (start.slot >= 0 && (start.slot & 0xFF) !== (slot & 0xFF)) {
              throw new Error(`回读槽位不匹配 ${start.slot + 1} != ${imgSlotNo(slot)}`);
            }
            if (start.offBytes === 3 || (typeof deviceInfo !== 'undefined' && Number(deviceInfo.fwBuild) >= 68)) {
              imgReadOffBytes = 3;
            } else {
              imgReadOffBytes = 2;
            }
            if (start.len > 0) {
              const nb = new Uint8Array(start.len);
              nb.fill(0xFF);
              nb.set(imgReadBuf.subarray(0, Math.min(imgReadBuf.length, start.len)));
              imgReadBuf = nb;
              imgReadExpect = start.len;
              if (imgReadGot > imgReadExpect) imgReadGot = imgReadExpect;
            }
            if (imgReadExpect <= 0) throw new Error('回读长度无效');
            if (imgReadExpect > 65535 && imgReadOffBytes !== 3) {
              addLog('当前固件回读偏移仅 16 位，大屏请烧录 b68+');
            }
            imgReadAccept = true;
            nextP = ownWait(waitFlashNotify('imgr=ok', Math.max(1000, deadline - Date.now()), 'imgr=err'));
            continue;
          }
          if (msg === 'imgr=ok' || (msg && String(msg).startsWith('imgr=ok'))) {
            await sleepMs(80);
            if (imgReadGot < imgReadExpect) {
              throw new Error(`回读不完整 ${imgReadGot}/${imgReadExpect}`);
            }
            const n = imgReadExpect || guess;
            const copy = new Uint8Array(imgReadBuf.subarray(0, n));
            imgReadCleanupWait(ownedWait);
            if (!skipUi) {
              imgSlotPayloadCache[slot] = copy;
              imgMaskSet(slot, true);
              const sz = imgInferBwrSize(copy, fallbackW, fallbackH);
              const thumb = document.querySelector(`.img-slot[data-slot="${slot}"] .img-slot-thumb`);
              if (thumb) paintBwrPayload(copy, sz.w, sz.h, thumb);
              addLog(`回读槽${imgSlotNo(slot)} ${copy.length}B ${((Date.now() - t0) / 1000).toFixed(2)}s`);
            }
            return copy;
          }
          throw new Error(msg || '回读失败');
        }
        throw new Error('回读超时');
      } catch (e) {
        imgReadCleanupWait(ownedWait);
        if (!e || !e._imgBusy) throw e;
      }
      addLog(`槽位忙，等待空闲 (${attempt + 1})`);
      await sleepMs(800);
    }
    throw new Error('设备忙，请稍后重试');
  } finally {
    imgReadSkipProgress = false;
  }
}

async function imgReadSlot() {
  if (typeof checkBluetoothConnection === 'function' && !checkBluetoothConnection()) return;
  if (imgReadBusy || (typeof flashOpActive !== 'undefined' && flashOpActive)) {
    await appAlert('请等待当前传输完成', '读取图片');
    return;
  }
  const slot = imgSelectedSlot();
  if (!imgMaskGet(slot)) {
    await appAlert(`槽位 ${imgSlotNo(slot)} 为空，无法读取`, '读取图片');
    return;
  }
  imgReadBusy = true;
  try {
    await imgReadSlotPayload(slot, `读取槽${imgSlotNo(slot)}`);
    setTimeout(() => clearTransferProgress(`槽位 ${imgSlotNo(slot)} 已读取`), 1200);
  } catch (e) {
    imgReadBuf = null;
    clearTransferProgress('读取失败');
    addLog(e.message || String(e));
  } finally {
    imgReadBusy = false;
  }
}

async function imgReadAllSlots() {
  if (typeof checkBluetoothConnection === 'function' && !checkBluetoothConnection()) return;
  if (imgReadBusy || (typeof flashOpActive !== 'undefined' && flashOpActive)) {
    await appAlert('请等待当前传输完成', '读取全部');
    return;
  }
  imgReadBusy = true;
  try {
    await imgRefreshInfo({ quiet: true });
    const slots = imgMaskUsedSlots();
    if (slots.length === 0) {
      await appAlert('没有已占用的图片槽位', '读取全部');
      clearTransferProgress('无图可读');
      return;
    }
    if (!await appConfirm(`将依次读取 ${slots.length} 个已占用槽位到缩略图。继续？`, '读取全部')) {
      clearTransferProgress('已取消');
      return;
    }
    addLog(`开始读取全部：${slots.length} 个槽位 [${slots.map(imgSlotNo).join(',')}]`);
    let doneCount = 0;
    for (const slot of slots) {
      await imgReadSlotPayload(slot, `读取全部 ${doneCount + 1}/${slots.length} 槽${imgSlotNo(slot)}`);
      doneCount++;
      await yieldUiPaint();
      await sleepMs(120);
    }
    imgUpdateSlotSelect();
    setTransferProgress(100, `全部读取完成 ${doneCount}/${slots.length}`);
    await appAlert(`已读取 ${doneCount} 个槽位到缩略图`, '读取全部');
  } catch (e) {
    imgReadBuf = null;
    imgReadResolve = null;
    imgReadReject = null;
    clearTransferProgress('读取全部失败');
    addLog(e.message || String(e));
    await appAlert(e.message || String(e), '读取全部失败');
  } finally {
    imgReadBusy = false;
  }
}

async function imgShowToCanvas() {
  const slot = imgSelectedSlot();
  const payload = imgSlotPayloadCache[slot];
  if (!payload) {
    await appAlert('请先「读取图片」到当前槽位缩略图，再显示到画布', '显示到画布');
    return;
  }
  const sz = imgInferBwrSize(payload, deviceInfo.width || 400, deviceInfo.height || 300);
  paintBwrPayload(payload, sz.w, sz.h, canvas);
  addLog(`已显示到画布 ${canvas.width}x${canvas.height}`);
}

function crc32Uint8(buf) {
  let crc = 0xFFFFFFFF;
  for (let i = 0; i < buf.length; i++) {
    crc ^= buf[i];
    for (let j = 0; j < 8; j++) {
      crc = (crc >>> 1) ^ (0xEDB88320 & -(crc & 1));
    }
  }
  return (crc ^ 0xFFFFFFFF) >>> 0;
}

function buildImgSlotBlob(bwrPayload, width, height) {
  const plane = Math.ceil(width / 8) * height;
  if (bwrPayload.length !== plane * 2) {
    throw new Error(`payload ${bwrPayload.length} != ${plane * 2}`);
  }
  const hdr = new Uint8Array(16);
  hdr[0] = 0x49; hdr[1] = 0x4D; hdr[2] = 0x41; hdr[3] = 0x47;
  const crc = crc32Uint8(bwrPayload);
  hdr[4] = crc & 0xff;
  hdr[5] = (crc >>> 8) & 0xff;
  hdr[6] = (crc >>> 16) & 0xff;
  hdr[7] = (crc >>> 24) & 0xff;
  hdr[8] = width & 0xff;
  hdr[9] = (width >>> 8) & 0xff;
  hdr[10] = height & 0xff;
  hdr[11] = (height >>> 8) & 0xff;
  hdr[12] = 2;
  const stride = imgEffectiveStride();
  const need = 16 + bwrPayload.length;
  if (stride < need) throw new Error(`stride ${stride} < blob ${need}`);
  const out = new Uint8Array(stride);
  out.fill(0xFF);
  out.set(hdr, 0);
  out.set(bwrPayload, 16);
  return { blob: out, crc: crc32Uint8(out) };
}

async function prepareCanvasBwr() {

async function uploadFlashPayload(buf, size, crc, beginCmd, okPrefix, label, beginPrefix, opts) {

        unc: p.unc,
        payload: [...u32le(p.offset), 0x01, ...p.rle],

  try {
    const beginBody = [...(beginPrefix || []), ...u32le(size), ...u32le(crc), ...(useExt ? [0x01] : [])];

      flashBusyFlag = false;
      flashAckError = null;
      const readyPromise = waitFlashNotify('flash=ready', 180000, null, {
        match: (msg) =>
          msg === 'flash=ready' || msg.startsWith('flash=busy') ||
          msg.startsWith('flash=err') || msg.startsWith('flash=bad') ||
          msg.startsWith('caltile=bad') || msg.startsWith('img=bad'),
      });

      readyMsg = await readyPromise;
      if (readyMsg === 'flash=ready') break;

      await sleepMs(800);
    }
    if (readyMsg !== 'flash=ready') throw new Error(readyMsg || 'BEGIN 失败');
    addLog('设备就绪，开始传数据');
    await sleepMs(20);
    let pktIdx = 0;
    let retries = 0;
    while (pktIdx < packets.length) {
      if (!bleDevice || !bleDevice.gatt.connected) throw new Error('蓝牙已断开');
      if (flashAckError && String(flashAckError).startsWith('flash=err')) throw new Error(flashAckError);
      const pkt = packets[pktIdx];
      flashBusyFlag = false;
      flashAckError = null;

      if (!ok) {
        retries++;
        if (retries > 40) throw new Error(`写入失败 @${pkt.offset}`);
        await sleepMs(20);
        continue;
      }
      await sleepMs(pktDelay);
      if (flashBusyFlag || (flashAckError && String(flashAckError).startsWith('flash=busy'))) {
        flashBusyFlag = false;
        flashAckError = null;
        retries++;
        if (retries > 100) throw new Error(`设备忙，放弃 @${pkt.offset}`);
        await sleepMs(60);
        continue;
      }
      pktIdx++;
      retries = 0;
      const sendOffset = pkt.offset + pkt.unc;
      const pct = 1 + (sendOffset / size) * 94;
      setTransferProgress(pct, `${label}：${sendOffset}/${size} (${pct.toFixed(1)}%)`);
      if ((pktIdx & 1) === 0) await yieldUiPaint();
    }
    const okPromise = waitFlashNotify(okPrefix, 180000, 'flash=bad', {
      match: (msg) =>
        msg === okPrefix || msg.startsWith(okPrefix) ||
        msg.startsWith('flash=bad') || msg.startsWith('flash=err'),
      ignore: (msg) => msg === 'img=queued' || /^img=\d+,/.test(msg),
    });
    if (!await write(EpdCmd.FLASH_END, null, true)) throw new Error('END 失败');
    const msg = await okPromise;
    const sec = ((new Date().getTime() - startTime) / 1000).toFixed(1);
    addLog(`烧录结束: ${msg}，耗时 ${sec}s`);
    if (String(msg).includes('bad') || String(msg).includes('err')) throw new Error(msg);
    setTransferProgress(100, `${label}完成：${msg}`);
    return { msg, status: `${label}完成`, elapsedSec: parseFloat(sec) };
  } finally {
    setFlashBusy(false);
  }
}

  const w = imageData.width;
  const h = imageData.height;
  const byteW = Math.ceil(w / 8);
  const black = new Uint8Array(byteW * h);
  const red = new Uint8Array(byteW * h);
  black.fill(0xFF);
  red.fill(0xFF);
  const d = imageData.data;
  const three = mode !== 'blackWhiteColor';
  for (let y = 0; y < h; y++) {
    for (let x = 0; x < w; x++) {
      const i = y * w + x;
      const pi = i * 4;
      const r = d[pi];
      const g = d[pi + 1];
      const b = d[pi + 2];
      const bi = y * byteW + (x >> 3);
      const bit = 0x80 >> (x & 7);
      const isRed = three && ((redMask && redMask[i]) || calBgIsRedRgb(r, g, b));
      const gray = 0.299 * r + 0.587 * g + 0.114 * b;
      if (isRed) {
        red[bi] &= ~bit;
      } else if (gray < 140) {
        black[bi] &= ~bit;
      }
    }
  }
  const payload = new Uint8Array(black.length + red.length);
  payload.set(black, 0);
  payload.set(red, black.length);
  return payload;
}

function calBgQuantizePalette(imageData, mode) {
  if (!imageData || !imageData.data) return;
  const d = imageData.data;
  const n = imageData.width * imageData.height;
  const three = mode !== 'blackWhiteColor';
  for (let i = 0; i < n; i++) {
    const p = i * 4;
    const r = d[p];
    const g = d[p + 1];
    const b = d[p + 2];
    if (three && r > 140 && r > g * 1.35 && r > b * 1.35) {
      d[p] = 255;
      d[p + 1] = 0;
      d[p + 2] = 0;
    } else {
      const gray = Math.round(0.299 * r + 0.587 * g + 0.114 * b);
      const v = gray < 128 ? 0 : 255;
      d[p] = v;
      d[p + 1] = v;
      d[p + 2] = v;
    }
  }
}

function calBgDitherImageData(imageData, id) {
  const saved = (id != null && calDither[id]) ? calDither[id] : calBgDitherReadUi();
  const contrast = Number.isFinite(saved.contrast) ? saved.contrast : 1.2;
  const alg = saved.alg || 'floydSteinberg';
  const strength = Number.isFinite(saved.strength) ? saved.strength : 1;
  const mode = calBgPackMode();
  const copy = new ImageData(new Uint8ClampedArray(imageData.data), imageData.width, imageData.height);
  if (typeof adjustContrast === 'function') adjustContrast(copy, contrast);
  const w = copy.width;
  const h = copy.height;
  const n = w * h;
  let dithered = copy;
  let redMask = null;
  if (alg === 'none') {
    calBgQuantizePalette(copy, mode);
    dithered = copy;
  } else {
    redMask = (mode === 'threeColor') ? new Uint8Array(n) : null;
    if (redMask) {
      const d = copy.data;
      for (let i = 0; i < n; i++) {
        const p = i * 4;
        if (calBgIsRedRgb(d[p], d[p + 1], d[p + 2])) {
          redMask[i] = 1;
          d[p] = 255;
          d[p + 1] = 255;
          d[p + 2] = 255;
        }
      }
    }
    const ditherMode = redMask ? 'blackWhiteColor' : mode;
    dithered = (typeof ditherImage === 'function') ? ditherImage(copy, alg, strength, ditherMode) : copy;
  }
  const payload = calBgPackBwr(dithered, mode, redMask);
  const tmp = document.createElement('canvas');
  let preview = dithered;
  if (typeof paintBwrPayload === 'function' && paintBwrPayload(payload, imageData.width, imageData.height, tmp)) {
    preview = tmp.getContext('2d').getImageData(0, 0, imageData.width, imageData.height);
  }
  return { payload, preview, mode };
}

function calBgPreviewSelected() {
  const id = calSel;
  if (!calSrc[id] || !calBgIsStatic(id)) return;
  const r = calBgRect(id);
  try {
    calBgDitherSave(id);
    const raw = calBgSample(id);
    if (!raw) return;
    const { payload, preview } = calBgDitherImageData(raw, id);
    calPayload[id] = payload;
    calPreview[id] = calBgCloneImageData(preview);
    if (calBgCtx && calPreview[id]) {
      calBgCtx.putImageData(calPreview[id], r.x, r.y);
      calBgStrokeFrame(calBgCtx, r);
      calBgCtx.strokeStyle = '#c62828';
      calBgCtx.lineWidth = 2;
      calBgCtx.strokeRect(r.x + 1, r.y + 1, r.w - 2, r.h - 2);
    }
  } catch (e) {
    if (typeof addLog === 'function') addLog(e.message || String(e));
  }
}

function calBgSchedulePreview() {
  if (calDitherTimer) clearTimeout(calDitherTimer);
  calDitherTimer = setTimeout(() => {
    calDitherTimer = 0;
    calBgPreviewSelected();
  }, 80);
}

function calBgOnDitherChange() {
  calBgDitherSave(calSel);
  if (calSrc[calSel] && calBgIsStatic(calSel)) calBgSchedulePreview();
}

function calBgZoomAt(id, factor, lx, ly) {
  const img = calSrc[id];
  const r = calBgRect(id);
  if (!img || !calBgIsStatic(id)) return;
  if (!calXf[id]) calXf[id] = calBgCoverXf(img, r.w, r.h);
  const t = calXf[id];
  const cx = lx != null ? lx : r.w / 2;
  const cy = ly != null ? ly : r.h / 2;
  const imgx = (cx - t.x) / t.scale;
  const imgy = (cy - t.y) / t.scale;
  t.scale = Math.max(0.05, Math.min(8, t.scale * factor));
  t.x = cx - imgx * t.scale;
  t.y = cy - imgy * t.scale;
  calBgRedraw({ live: true });
  calBgSchedulePreview();
}

function calBgZoom(factor) {
  const r = calBgRect(calSel);
  calBgZoomAt(calSel, factor, r.w / 2, r.h / 2);
}

async function calBgSendMask() {
  if (typeof write !== 'function' || !bleDevice || !bleDevice.gatt || !bleDevice.gatt.connected) return;
  await write(EpdCmd.CAL_TILE, [calMask & 7]);
}

async function calBgSetMode(mode) {
  const id = calSel;
  const bit = 1 << id;
  calMode[id] = mode === 'static' ? 'static' : 'dyn';
  if (calMode[id] === 'dyn') {
    calMask &= ~bit;
    calBgRedraw();
    await calBgSendMask();
    return;
  }
  if (calPayload[id] || calSrc[id]) {
    calMask |= bit;
    await calBgSendMask();
  }
  if (calSrc[id]) calBgPreviewSelected();
  else {
    calBgRedraw();
    calBgMaybeLoadSelected();
  }
}

function calBgOnFile(ev) {
  const file = ev.target && ev.target.files && ev.target.files[0];
  if (!file) return;
  const url = URL.createObjectURL(file);
  const img = new Image();
  img.onload = () => {
    URL.revokeObjectURL(url);
    const r = calBgRect(calSel);
    calSrc[calSel] = img;
    calXf[calSel] = calBgCoverXf(img, r.w, r.h);
    calMode[calSel] = 'static';
    calBgPreviewSelected();
    calBgSyncModeUi();
  };
  img.onerror = () => {
    URL.revokeObjectURL(url);
    if (typeof addLog === 'function') addLog('图片加载失败');
  };
  img.src = url;
  ev.target.value = '';
}

function calBgBuildBlob(payload, w, h) {
  const plane = Math.ceil(w / 8) * h;
  if (!payload || payload.length !== plane * 2) {
    throw new Error(`区域 payload ${payload && payload.length} != ${plane * 2}`);
  }
  const hdr = new Uint8Array(16);
  hdr[0] = 0x49; hdr[1] = 0x4D; hdr[2] = 0x41; hdr[3] = 0x47;
  const crcPay = crc32Uint8(payload);
  hdr[4] = crcPay & 0xff;
  hdr[5] = (crcPay >>> 8) & 0xff;
  hdr[6] = (crcPay >>> 16) & 0xff;
  hdr[7] = (crcPay >>> 24) & 0xff;
  hdr[8] = w & 0xff;
  hdr[9] = (w >>> 8) & 0xff;
  hdr[10] = h & 0xff;
  hdr[11] = (h >>> 8) & 0xff;
  hdr[12] = 2;
  const used = 16 + payload.length;
  const n = (typeof deviceInfo !== 'undefined' && Number(deviceInfo.fwBuild) >= 103) ? used : CAL_TILE_STRIDE;
  const out = new Uint8Array(n);
  out.fill(0xFF);
  out.set(hdr, 0);
  out.set(payload, 16);
  return { blob: out, crc: crc32Uint8(out) };
}

async function calBgAbortLoad() {
  if (!calBgLoading) return true;
  calBgLoadAgain = false;
  for (let n = 0; n < 40 && calBgLoading; n++) {
    if (typeof sleepMs === 'function') await sleepMs(50);
    else await new Promise((r) => setTimeout(r, 50));
  }
  return !calBgLoading;
}

async function calBgUploadCore() {
  const id = calSel;
  const r = calBgRect(id);
  if (!calSrc[id] && !calPayload[id] && !calOcc[id]) throw new Error('请先选择图片');
  if (calOcc[id] && !calSrc[id]) return;
  if (calSrc[id]) calBgPreviewSelected();
  if (!calPayload[id]) throw new Error('请先调整图片预览');
  if (calBgLoading) throw new Error('请等待当前区块图片传完');
  calBgSuppressLoad = true;
  if (typeof setXferBarHost === 'function') setXferBarHost('cal');
  const { blob, crc } = calBgBuildBlob(calPayload[id], r.w, r.h);
  addLog(`上传${CAL_TILE_NAMES[id]} ${r.w}x${r.h} ${blob.length}B`);
  await uploadFlashPayload(blob, blob.length, crc, EpdCmd.CAL_TILE_BEGIN, 'flash=ok',
    `日历区:${CAL_TILE_NAMES[id]}`, [id], { pktDelayMs: 2 });
  calMask |= (1 << id);
  calOcc[id] = 1;
  calMode[id] = 'static';
  calBgPersistCache();
  await calBgSendMask();
  calBgRedraw();
  if (typeof clearTransferProgress === 'function') clearTransferProgress();
}

async function calBgRefreshScreen() {
  let mask = 0;
  for (let i = 0; i < 3; i++) {
    if (calMode[i] === 'static' && calOcc[i]) mask |= (1 << i);
  }
  calMask = mask;
  if (!await write(EpdCmd.CAL_TILE, [calMask])) throw new Error('区域模式发送失败');
  await sleepMs(40);
  if (!await write(EpdCmd.CAL_TILE, [0xFE])) throw new Error('刷新命令发送失败');
  if (typeof imgClearDisplayedSlot === 'function') imgClearDisplayedSlot();
}

async function calBgApply() {
  if (typeof checkBluetoothConnection === 'function' && !checkBluetoothConnection()) return;
  if (calBgUploading || (typeof flashOpActive !== 'undefined' && flashOpActive)) {
    await appAlert('请等待当前操作结束', '存储并更新屏幕');
    return;
  }
  const isSt = calBgIsStatic(calSel);
  if (isSt && !calSrc[calSel] && !calPayload[calSel] && !calOcc[calSel]) {
    await appAlert('请先选择图片', '存储并更新屏幕');
    return;
  }
  calBgUploading = true;
  calBgUpdateBusyUi();
  try {
    if (isSt) await calBgUploadCore();
    else if (calSel === 1) {
      if (typeof saveFocusCountdown !== 'function' || !await saveFocusCountdown()) return;
    } else if (calSel === 2) {
      if (typeof saveCountdown !== 'function' || !await saveCountdown()) return;
    }
    await calBgRefreshScreen();
    addLog('已存储并更新屏幕');
  } catch (e) {
    if (String(e && e.message) === 'cancelled') return;
    addLog(e.message || String(e));
    await appAlert(e.message || String(e), '存储并更新失败');
  } finally {
    calBgUploading = false;
    if (typeof setXferBarHost === 'function') setXferBarHost('main');
    setTimeout(() => { calBgSuppressLoad = false; }, 800);
    calBgUpdateBusyUi();
  }
}

async function calBgClearAction() {
  if (typeof checkBluetoothConnection === 'function' && !checkBluetoothConnection()) return;
  if (calBgUploading || (typeof flashOpActive !== 'undefined' && flashOpActive)) return;
  const isSt = calBgIsStatic(calSel);
  if (isSt) await calBgClear();
  else if (calSel === 1) await clearFocusCountdown();
  else if (calSel === 2) await clearCountdown();
}

async function calBgClear() {
  if (typeof checkBluetoothConnection === 'function' && !checkBluetoothConnection()) return;
  if (calBgUploading || (typeof flashOpActive !== 'undefined' && flashOpActive)) return;
  const id = calSel;
  const hasDev = !!calOcc[id];
  const hasLocal = !!(calSrc[id] || calPayload[id]);
    if (!hasDev && !hasLocal) {
    await appAlert('该区域没有可清空的图片', '日历背景图');
    return;
  }
  if (typeof appConfirm === 'function' &&
      !await appConfirm(`清空「${CAL_TILE_NAMES[id]}」的静态图并恢复动态内容？确认后会自动刷屏。`, '清空')) {
    return;
  }
  calBgUploading = true;
  calBgSuppressLoad = true;
  calBgUpdateBusyUi();
  try {
    if (hasDev) {
      if (!await write(EpdCmd.CAL_TILE, [0x10 | id])) throw new Error('清空命令发送失败');
      await sleepMs(40);
    }
    calMask &= ~(1 << id);
    calOcc[id] = 0;
    calSrc[id] = null;
    calXf[id] = null;
    calPayload[id] = null;
    calPreview[id] = null;
    calMode[id] = 'dyn';
    calBgPersistCache();
    await calBgRefreshScreen();
    addLog(`已清空${CAL_TILE_NAMES[id]}并刷新屏幕`);
    calBgRedraw();
  } catch (e) {
    addLog(e.message || String(e));
    await appAlert(e.message || String(e), '清空失败');
  } finally {
    calBgUploading = false;
    setTimeout(() => { calBgSuppressLoad = false; }, 800);
    calBgUpdateBusyUi();
  }
}

function calBgParseGeom(msg) {
  const parts = msg.substring(8).split(',').map((s) => parseInt(s, 10));
  if (parts.length < 12 || parts.some((n) => !Number.isFinite(n))) return;
  calGeom = [
    { x: parts[0], y: parts[1], w: parts[2], h: parts[3] },
    { x: parts[4], y: parts[5], w: parts[6], h: parts[7] },
    { x: parts[8], y: parts[9], w: parts[10], h: parts[11] },
  ];
  calBgRedraw();
}

function calBgParseTile(msg) {
  const parts = msg.substring(8).split(',').map((s) => parseInt(s, 10));
  if (parts.length < 4 || parts.some((n) => !Number.isFinite(n))) return;
  calMask = parts[0] & 7;
  const nextOcc = [parts[1] ? 1 : 0, parts[2] ? 1 : 0, parts[3] ? 1 : 0];
  for (let i = 0; i < 3; i++) {
    if (!nextOcc[i] && !calSrc[i]) {
      calPayload[i] = null;
      calPreview[i] = null;
    }
  }
  calOcc = nextOcc;
  calMode = [0, 1, 2].map((i) => ((calMask & (1 << i)) ? 'static' : 'dyn'));
  calBgHydrateCache();
  calBgRedraw();
}

function calBgOnNotify(msg) {
  if (msg.startsWith('calgeom=') || msg.startsWith('caltile=')) {
    if (typeof deviceInfo !== 'undefined') deviceInfo.calTile = true;
    updateCalFeatureUi();
  }
  if (msg.startsWith('calgeom=')) calBgParseGeom(msg);
  else if (msg.startsWith('caltile=')) calBgParseTile(msg);
}

function calBgMaybeLoadSelected() {
  const id = calSel;
  if (!calBgIsStatic(id) || !calOcc[id] || calSrc[id]) return;
  if (calPayload[id]) {
    calBgRedraw();
    return;
  }
  if (calBgSuppressLoad || calBgUploading) return;
  if (typeof imgReadBusy !== 'undefined' && imgReadBusy) return;
  calBgScheduleLoad();
}

function calBgScheduleLoad() {
  const seq = ++calBgLoadSeq;
  setTimeout(() => {
    if (seq !== calBgLoadSeq) return;
    calBgLoadSelected(calSel).catch(() => {});
  }, 200);
}

async function calBgLoadSelected(id) {
  if (id == null) id = calSel;
  if (calBgLoading) {
    calBgLoadAgain = true;
    return;
  }
  if (typeof flashOpActive !== 'undefined' && flashOpActive) return;
  if (typeof imgReadBusy !== 'undefined' && imgReadBusy) return;
  if (!bleDevice || !bleDevice.gatt || !bleDevice.gatt.connected) return;
  if (typeof imgReadSlotPayload !== 'function') return;
  if (!calBgIsStatic(id) || !calOcc[id] || calSrc[id] || calPayload[id]) return;
  calBgLoading = true;
  calBgReading[id] = true;
  calBgRedraw();
  try {
    do {
      calBgLoadAgain = false;
      id = calSel;
      if (!calBgIsStatic(id) || !calOcc[id] || calSrc[id] || calPayload[id]) break;
      try {
        const payload = await imgReadSlotPayload(CAL_TILE_SLOT_BASE | id, `日历区:${CAL_TILE_NAMES[id]}`, { skipUi: true });
        calPayload[id] = payload;
        calBgPersistCache();
        addLog(`已回读${CAL_TILE_NAMES[id]} ${payload.length}B`);
      } catch (e) {
        if (String(e.message || e) !== 'cancelled') {
          addLog(`${CAL_TILE_NAMES[id]} 回读失败: ${e.message || e}`);
        }
      }
    } while (calBgLoadAgain);
  } finally {
    calBgLoading = false;
    calBgReading = [false, false, false];
    calBgRedraw();
  }
}

async function calBgLoadOccupied() {
  return calBgLoadSelected(calSel);
}

async function calBgOnConnected() {
  calBgSyncColorFromDriver();
  calBgDitherLoad(calSel);
  updateCalFeatureUi();
}

function calBgOnPointerDown(ev) {
  if (!calBgCanvas) return;
  const p = calBgCanvasPos(ev);
  const id = calBgHit(p.x, p.y);
  if (id < 0) return;
  if (id !== calSel) calBgSelect(id);
  if (!calBgIsStatic(id) || !calSrc[id]) return;
  const r = calBgRect(id);
  calPtr = { id, x: p.x, y: p.y, moved: false, ox: calXf[id] ? calXf[id].x : 0, oy: calXf[id] ? calXf[id].y : 0, lx: p.x - r.x, ly: p.y - r.y };
  calBgCanvas.setPointerCapture(ev.pointerId);
}

function calBgOnPointerMove(ev) {
  if (!calPtr) return;
  const p = calBgCanvasPos(ev);
  const dx = p.x - calPtr.x;
  const dy = p.y - calPtr.y;
  if (!calPtr.moved && (dx * dx + dy * dy) < 9) return;
  calPtr.moved = true;
  const img = calSrc[calPtr.id];
  const r = calBgRect(calPtr.id);
  if (!img) return;
  if (!calXf[calPtr.id]) calXf[calPtr.id] = calBgCoverXf(img, r.w, r.h);
  calXf[calPtr.id].x = calPtr.ox + dx;
  calXf[calPtr.id].y = calPtr.oy + dy;
  calBgRedraw({ live: true });
}

function calBgOnPointerUp(ev) {
  if (!calPtr) return;
  const moved = calPtr.moved;
  calPtr = null;
  try { calBgCanvas.releasePointerCapture(ev.pointerId); } catch (_) {}
  if (moved) {
    calBgRedraw();
    calBgPreviewSelected();
  }
}

function calBgOnWheel(ev) {
  if (!calBgCanvas) return;
  const p = calBgCanvasPos(ev);
  const id = calBgHit(p.x, p.y);
  if (id < 0 || !calBgIsStatic(id) || !calSrc[id]) return;
  ev.preventDefault();
  if (id !== calSel) calBgSelect(id);
  const r = calBgRect(id);
  calBgZoomAt(id, ev.deltaY > 0 ? 0.9 : 1.1, p.x - r.x, p.y - r.y);
}

function calBgInit() {
  calBgCanvas = document.getElementById('calBgCanvas');
  if (!calBgCanvas) return;
  calBgCtx = calBgCanvas.getContext('2d');
  calBgCanvas.addEventListener('pointerdown', calBgOnPointerDown);
  calBgCanvas.addEventListener('pointermove', calBgOnPointerMove);
  calBgCanvas.addEventListener('pointerup', calBgOnPointerUp);
  calBgCanvas.addEventListener('pointercancel', calBgOnPointerUp);
  calBgCanvas.addEventListener('wheel', calBgOnWheel, { passive: false });
  const str = document.getElementById('calDitherStrength');
  const con = document.getElementById('calDitherContrast');
  if (str) {
    str.addEventListener('input', () => {
      const lab = document.getElementById('calDitherStrengthValue');
      if (lab) lab.innerText = parseFloat(str.value).toFixed(1);
      calBgOnDitherChange();
    });
  }
  if (con) {
    con.addEventListener('input', () => {
      const lab = document.getElementById('calDitherContrastValue');
      if (lab) lab.innerText = parseFloat(con.value).toFixed(1);
      calBgOnDitherChange();
    });
  }
  calBgSyncColorFromDriver();
  calBgDitherLoad(calSel);
  calBgUpdateVisibility();
  calBgUpdateBusyUi();
  calBgRedraw();
}

if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', calBgInit);
} else {
  calBgInit();
}
