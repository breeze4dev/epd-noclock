#countdownRows .cd-row {

<body>
	<div class="main">
		<h3>墨水屏日历</h3>
		<div class="info-notice">
			<div class="info-content">

			</div>
		</div>
		<fieldset>
			<legend>蓝牙连接</legend>
			<div class="flex-container">
				<div class="flex-group">

					<button type="button" class="secondary" onclick="clearLog()">清空日志</button>
				</div>
				<div class="flex-group right debug">
					<label for="epddriver">驱动</label>
					<select id="epddriver" onchange="updateDitcherOptions()">
						<option value="01" data-color="blackWhiteColor" data-size="4.2_400_300">4.2寸 (黑白, UC8176)</option>
						<option value="03" data-color="threeColor" data-size="4.2_400_300">4.2寸 (三色, UC8176)</option>
						<option value="04" data-color="blackWhiteColor" data-size="4.2_400_300">4.2寸 (黑白, SSD1619)</option>
						<option value="02" data-color="threeColor" data-size="4.2_400_300">4.2寸 (三色, SSD1619)</option>
						<option value="05" data-color="fourColor" data-size="4.2_400_300">4.2寸 (四色, JD79668)</option>
						<option value="0f" data-color="blackWhiteColor" data-size="5.83_600_448">5.83寸低分 (黑白, UC8159)</option>
						<option value="0e" data-color="threeColor" data-size="5.83_600_448">5.83寸低分 (三色, UC8159)</option>
						<option value="11" data-color="blackWhiteColor" data-size="5.83_648_480">5.83寸 (黑白, UC8179)</option>
						<option value="10" data-color="threeColor" data-size="5.83_648_480">5.83寸 (三色, UC8179)</option>
						<option value="0d" data-color="fourColor" data-size="5.83_648_480">5.83寸 (四色, JD79665)</option>
						<option value="06" data-color="blackWhiteColor" data-size="7.5_800_480">7.5寸 (黑白, UC8179)</option>
						<option value="07" data-color="threeColor" data-size="7.5_800_480">7.5寸 (三色, UC8179)</option>
						<option value="0c" data-color="fourColor" data-size="7.5_800_480">7.5寸 (四色, JD79665)</option>
						<option value="08" data-color="blackWhiteColor" data-size="7.5_640_384">7.5寸低分 (黑白, UC8159)</option>
						<option value="09" data-color="threeColor" data-size="7.5_640_384">7.5寸低分 (三色, UC8159)</option>
						<option value="0a" data-color="blackWhiteColor" data-size="7.5_880_528">7.5寸HD (黑白, SSD1677)</option>
						<option value="0b" data-color="threeColor" data-size="7.5_880_528">7.5寸HD (三色, SSD1677)</option>
					</select>
				</div>
				<div class="flex-group debug">
					<label for="epdpins">引脚</label>
					<input id="epdpins" type="text" value="">
					<label for="epdkeypin">按键IO</label>
					<input id="epdkeypin" type="number" min="0" max="31" value="27" title="P0.x">
					<button id="setDriverbutton" type="button" class="primary" onclick="setDriver()">确定</button>
				</div>
			</div>
			<div class="log-container" id="log"></div>
		</fieldset>
		<fieldset>
			<legend>设备控制</legend>
			<div class="flex-container">
				<div class="flex-group">
					<button id="calendarmodebutton" type="button" class="primary" onclick="syncTime(1)">日历模式</button>
					<button id="debugcalendarbutton" type="button" class="secondary" onclick="showDebugCalendar()">选择日期</button>
					<button id="clearscreenbutton" type="button" class="secondary" onclick="clearScreen()">清除屏幕</button>
					<label title="关闭后上电仍广播5分钟，之后需长按按键；开启后一直广播">
						<input id="bleAlwaysOn" type="checkbox" onchange="setBleAlwaysOn()"> 蓝牙常开

					<span id="calendarThemeWrap" hidden>
						<label for="calendarThemeSelect">日历主题</label>
						<select id="calendarThemeSelect" onchange="updateCalendarTheme(this)">

						</select>
					</span>

			</div>

					<input id="holidayFile" type="file" accept=".json,application/json" hidden onchange="holidayFromFile(event)">

				</div>
			</div>
			<p class="img-slot-hint" id="holidayStatus">调休数据：未连接。数据格式见 <a href="https://github.com/NateScarlet/holiday-cn" target="_blank" rel="noopener">holiday-cn</a></p>
		</fieldset>
		<fieldset id="calBgFieldset" class="cal-bg-fieldset" hidden>
			<legend>日历区块管理</legend>

				<p class="img-slot-hint cal-bg-xfer-text" id="calBgXferText" hidden></p>

					<label><input type="radio" name="calBgMode" value="static" onchange="calBgSetMode('static')"> 静态图</label>

			</div>

	<script type="text/javascript">
// Ported from: https://e-paper-display.cn/usb2epd.html

// 固定的六色调色板
const rgbPalette = [
  { name: "黑色", r: 0, g: 0, b: 0, value: 0x00 },
  { name: "白色", r: 255, g: 255, b: 255, value: 0x01 },
  { name: "黄色", r: 255, g: 255, b: 0, value: 0x02 },
  { name: "红色", r: 255, g: 0, b: 0, value: 0x03 },
  { name: "蓝色", r: 0, g: 0, b: 255, value: 0x05 },
  { name: "绿色", r: 41, g: 204, b: 20, value: 0x06 }
];

// 四色调色板
const fourColorPalette = [
  { name: "黑色", r: 0, g: 0, b: 0, value: 0x00 },
  { name: "白色", r: 255, g: 255, b: 255, value: 0x01 },
  { name: "红色", r: 255, g: 0, b: 0, value: 0x03 },
  { name: "黄色", r: 255, g: 255, b: 0, value: 0x02 }
];

// 三色调色板
const threeColorPalette = [
  { name: "黑色", r: 0, g: 0, b: 0, value: 0x00 },
  { name: "白色", r: 255, g: 255, b: 255, value: 0x01 },
  { name: "红色", r: 255, g: 0, b: 0, value: 0x02 }
];

function adjustContrast(imageData, factor) {
  const data = imageData.data;
  for (let i = 0; i < data.length; i += 4) {
    data[i] = Math.min(255, Math.max(0, (data[i] - 128) * factor + 128));
    data[i + 1] = Math.min(255, Math.max(0, (data[i + 1] - 128) * factor + 128));
    data[i + 2] = Math.min(255, Math.max(0, (data[i + 2] - 128) * factor + 128));
  }
  return imageData;
}

function rgbToLab(r, g, b) {
  r = r / 255;
  g = g / 255;
  b = b / 255;

  r = r > 0.04045 ? Math.pow((r + 0.055) / 1.055, 2.4) : r / 12.92;
  g = g > 0.04045 ? Math.pow((g + 0.055) / 1.055, 2.4) : g / 12.92;
  b = b > 0.04045 ? Math.pow((b + 0.055) / 1.055, 2.4) : b / 12.92;

  r *= 100;
  g *= 100;
  b *= 100;

  let x = r * 0.4124 + g * 0.3576 + b * 0.1805;
  let y = r * 0.2126 + g * 0.7152 + b * 0.0722;
  let z = r * 0.0193 + g * 0.1192 + b * 0.9505;

  x /= 95.047;
  y /= 100.0;
  z /= 108.883;

  x = x > 0.008856 ? Math.pow(x, 1 / 3) : (7.787 * x) + (16 / 116);
  y = y > 0.008856 ? Math.pow(y, 1 / 3) : (7.787 * y) + (16 / 116);
  z = z > 0.008856 ? Math.pow(z, 1 / 3) : (7.787 * z) + (16 / 116);

  const l = (116 * y) - 16;
  const a = 500 * (x - y);
  const bLab = 200 * (y - z);

  return { l, a, b: bLab };
}

function labDistance(lab1, lab2) {
  const dl = lab1.l - lab2.l;
  const da = lab1.a - lab2.a;
  const db = lab1.b - lab2.b;
  return Math.sqrt(0.2 * dl * dl + 3 * da * da + 3 * db * db);
}

function colorDistance(c1, c2) {
  return Math.sqrt(
    Math.pow(c1.r - c2.r, 2) +
    Math.pow(c1.g - c2.g, 2) +
    Math.pow(c1.b - c2.b, 2)
  );
}

function findNearestColor(pixel, colors) {
  let nearestColor = colors[0];
  let minDistance = colorDistance(pixel, colors[0]);
  for (let i = 1; i < colors.length; i++) {
    const distance = colorDistance(pixel, colors[i]);
    if (distance < minDistance) {
      minDistance = distance;
      nearestColor = colors[i];
    }
  }
  return nearestColor;
}

function findClosestColor(r, g, b, mode) {
  let palette;

  if (mode === 'fourColor') {
    palette = fourColorPalette;
  } else if (mode === 'threeColor') {
    palette = threeColorPalette;
  } else {
    palette = rgbPalette;
  }

  // 蓝色特殊情况（仅限非三色、四色模式）
  if (mode !== 'fourColor' && mode !== 'threeColor' && r < 50 && g < 150 && b > 100) {
    return rgbPalette[4]; // 蓝色
  }

  if (mode === 'BWR') return findNearestColor({ r, g, b }, palette);

  const inputLab = rgbToLab(r, g, b);
  let minDistance = Infinity;
  let closestColor = palette[0];

  for (const color of palette) {

function bayerDither(imageData, strength, mode) {
  const width = imageData.width;
  const height = imageData.height;
  const data = imageData.data;

  // 8x8 Bayer matrix (normalized to 0-1 range)
  const bayerMatrix = [
    [0, 32, 8, 40, 2, 34, 10, 42],
    [48, 16, 56, 24, 50, 18, 58, 26],
    [12, 44, 4, 36, 14, 46, 6, 38],
    [60, 28, 52, 20, 62, 30, 54, 22],
    [3, 35, 11, 43, 1, 33, 9, 41],
    [51, 19, 59, 27, 49, 17, 57, 25],
    [15, 47, 7, 39, 13, 45, 5, 37],
    [63, 31, 55, 23, 61, 29, 53, 21]
  ];

  const matrixSize = 8;
  const maxThreshold = 64;

  for (let y = 0; y < height; y++) {
    for (let x = 0; x < width; x++) {
      const idx = (y * width + x) * 4;
      const r = data[idx];
      const g = data[idx + 1];
      const b = data[idx + 2];

      // Get threshold from Bayer matrix
      const matrixX = x % matrixSize;
      const matrixY = y % matrixSize;
      const threshold = (bayerMatrix[matrixY][matrixX] / maxThreshold) * 255;

      // Apply dithering with strength factor
      const adjustedR = r + (threshold - 127.5) * strength;
      const adjustedG = g + (threshold - 127.5) * strength;
      const adjustedB = b + (threshold - 127.5) * strength;

      // Clamp values
      const clampedR = Math.min(255, Math.max(0, adjustedR));
      const clampedG = Math.min(255, Math.max(0, adjustedG));
      const clampedB = Math.min(255, Math.max(0, adjustedB));

      // Find closest color in palette
      const closest = findClosestColor(clampedR, clampedG, clampedB, mode);

      data[idx] = closest.r;
      data[idx + 1] = closest.g;
      data[idx + 2] = closest.b;
    }
  }

  return imageData;
}

function ditherImage(imageData, alg, strength, mode) {
  switch (alg) {
    case 'floydSteinberg':
      return floydSteinbergDither(imageData, strength, mode);
    case 'atkinson':
      return atkinsonDither(imageData, strength, mode);
    case 'stucki':
      return stuckiDither(imageData, strength, mode);
    case 'jarvis':
      return jarvisDither(imageData, strength, mode);
    case 'bayer':
      return bayerDither(imageData, strength, mode);
    case 'none':
    default:

  }
}

function decodeProcessedData(processedData, width, height, mode) {
  const imageData = new ImageData(width, height);

  if (mode === 'sixColor') {
    for (let y = 0; y < height; y++) {
      for (let x = 0; x < width; x++) {
        const newIndex = (y * width + x) >> 1;
        const colorValue = (x % 2 === 0)
          ? (processedData[newIndex] >> 4) & 0x0F
          : processedData[newIndex] & 0x0F;
        const color = rgbPalette.find(c => c.value === colorValue) || rgbPalette[1]; // 默认白色
        const index = (y * width + x) * 4;
        data[index] = color.r;
        data[index + 1] = color.g;
        data[index + 2] = color.b;
        data[index + 3] = 255;
      }
    }
  } else if (mode === 'fourColor') {
    const fourColorValues = [
      { value: 0x00, r: 0, g: 0, b: 0 },      // 黑色
      { value: 0x01, r: 255, g: 255, b: 255 }, // 白色
      { value: 0x03, r: 255, g: 0, b: 0 },     // 红色
      { value: 0x02, r: 255, g: 255, b: 0 }    // 黄色

      for (let x = 0; x < width; x++) {
        const newIndex = (y * width + x) / 4 | 0;
        const shift = 6 - ((x % 4) * 2);
        const value = (processedData[newIndex] >> shift) & 0x03;
        const color = fourColorValues.find(c => c.value === value) || fourColorValues[1]; // 默认白色
        const index = (y * width + x) * 4;
        data[index] = color.r;
        data[index + 1] = color.g;
        data[index + 2] = color.b;
        data[index + 3] = 255;
      }
    }
  } else if (mode === 'blackWhiteColor') {

        const index = (y * width + x) * 4;
        data[index] = bit ? 255 : 0; // 白或黑
        data[index + 1] = bit ? 255 : 0;
        data[index + 2] = bit ? 255 : 0;
        data[index + 3] = 255;
      }

  } else if (mode === 'threeColor') {
    const byteWidth = Math.ceil(width / 8);
    const blackWhiteData = processedData.slice(0, byteWidth * height);
    const redWhiteData = processedData.slice(byteWidth * height);
    for (let y = 0; y < height; y++) {
      for (let x = 0; x < width; x++) {
        const byteIndex = y * byteWidth + Math.floor(x / 8);
        const bitIndex = 7 - (x % 8);
        const blackWhiteBit = (blackWhiteData[byteIndex] >> bitIndex) & 1;
        const redWhiteBit = (redWhiteData[byteIndex] >> bitIndex) & 1;
        const index = (y * width + x) * 4;
        if (!redWhiteBit) {
          // 红色
          data[index] = 255;
          data[index + 1] = 0;
          data[index + 2] = 0;
        } else {

          data[index] = blackWhiteBit ? 255 : 0;

    for (let y = 0; y < height; y++) {

        const b = data[index + 2];
        const closest = findClosestColor(r, g, b, mode);
        const colorValue = closest.value; // 0-5
        const newIndex = (y * width + x) >> 1;
        if (x % 2 === 0) {

        } else {

    }
  } else if (mode === 'fourColor') {
    processedData = new Uint8Array(Math.ceil((width * height) / 4));
    for (let y = 0; y < height; y++) {
      for (let x = 0; x < width; x++) {

    for (let y = 0; y < height; y++) {
      for (let x = 0; x < width; x++) {

        const grayscale = Math.round(0.299 * r + 0.587 * g + 0.114 * b);
        const bit = grayscale >= threshold ? 1 : 0;
        const byteIndex = y * byteWidth + Math.floor(x / 8);
        const bitIndex = 7 - (x % 8);

    const byteWidth = Math.ceil(width / 8);
    const blackWhiteThreshold = 140;
    const redThreshold = 160;

    const blackWhiteData = new Uint8Array(height * byteWidth);
    const redWhiteData = new Uint8Array(height * byteWidth);

    for (let y = 0; y < height; y++) {
      for (let x = 0; x < width; x++) {
        const index = (y * width + x) * 4;
        const r = data[index];
        const g = data[index + 1];
        const b = data[index + 2];
        const grayscale = Math.round(0.299 * r + 0.587 * g + 0.114 * b);

        const blackWhiteBit = grayscale >= blackWhiteThreshold ? 1 : 0;
        const blackWhiteByteIndex = y * byteWidth + Math.floor(x / 8);
        const blackWhiteBitIndex = 7 - (x % 8);
        if (blackWhiteBit) {
          blackWhiteData[blackWhiteByteIndex] |= (0x01 << blackWhiteBitIndex);
        } else {
          blackWhiteData[blackWhiteByteIndex] &= ~(0x01 << blackWhiteBitIndex);
        }

        const redWhiteBit = (r > redThreshold && r > g && r > b) ? 0 : 1;
        const redWhiteByteIndex = y * byteWidth + Math.floor(x / 8);
        const redWhiteBitIndex = 7 - (x % 8);
        if (redWhiteBit) {
          redWhiteData[redWhiteByteIndex] |= (0x01 << redWhiteBitIndex);
        } else {
          redWhiteData[redWhiteByteIndex] &= ~(0x01 << redWhiteBitIndex);
        }
      }
    }

    processedData = new Uint8Array(blackWhiteData.length + redWhiteData.length);
    processedData.set(blackWhiteData, 0);
    processedData.set(redWhiteData, blackWhiteData.length);

// RLE-compress a byte array.
function rleCompress(data, maxLiteralSize = 128) {
  const input = data instanceof Uint8Array ? data : new Uint8Array(data);
  const result = [];
  let i = 0;

  while (i < input.length) {
    let runLen = 1;
    // Count repeating bytes (max 130)
    while (i + runLen < input.length && runLen < 130 && input[i + runLen] === input[i]) {
      runLen++;
    }

    if (runLen >= 3) {
      // Repeat run: control = 0x80 | (runLen - 3)
      result.push(0x80 | (runLen - 3));
      result.push(input[i]);
      i += runLen;
    } else {
      // Literal run: collect up to maxLiteralSize bytes
      const literalStart = i;
      let literalLen = 0;
      while (i < input.length && literalLen < maxLiteralSize) {
        // Check if the next bytes form a long repeat run (>= 3)
        if (i + 2 < input.length && input[i] === input[i + 1] && input[i] === input[i + 2]) {
          break;
        }
        literalLen++;
        i++;
      }
      if (literalLen === 0) {
        // Should not happen, but fallback: single byte literal
        result.push(0x00);
        result.push(input[i++]);
      } else {
        result.push(literalLen - 1);
        for (let j = literalStart; j < literalStart + literalLen; j++) {
          result.push(input[j]);
        }
      }
    }
  }

  return new Uint8Array(result);
}

// RLE-compress ENTIRE data, then split the compressed stream at RLE-code
// boundaries so each chunk is a valid, complete RLE stream that fills the
// MTU as much as possible without truncating any code.
function rleCompressMTU(data, maxChunkSize) {
  // Constrain literal runs so a single code never exceeds maxChunkSize.
  // The control byte takes 1 byte, so data bytes ≤ maxChunkSize - 1.
  const maxLit = Math.min(maxChunkSize - 1, 128);
  const input = rleCompress(data, maxLit);     // compress with safe literal limit
  const chunks = [];
  let i = 0;
  let start = 0;

  while (i < input.length) {
    const control = input[i];
    // RLE code length: repeat = 2 bytes, literal = 1 + (control + 1) bytes
    const codeLen = (control & 0x80) ? 2 : (control + 2);

    // Flush if adding this code would exceed maxChunkSize AND we already
    // have data in the current chunk (don't split a code across chunks).
    // If a single code is larger than maxChunkSize it gets its own chunk.
    if (i - start + codeLen > maxChunkSize && i > start) {
      chunks.push(input.slice(start, i));
      start = i;
    }
    i += codeLen;
  }

  if (i > start) chunks.push(input.slice(start, i));
  return chunks;
}

function rleCodeLen(control) {
  return (control & 0x80) ? 2 : (control + 2);
}

function rleCodeUncLen(control) {
  return (control & 0x80) ? ((control & 0x7f) + 3) : (control + 1);
}

/**
 * Whole-buffer RLE packed into flash DATA packets.
 * Each packet's RLE bytes ≤ maxRlePayload and uncompressed ≤ maxUnc.
 */
function rlePackFlashPackets(data, maxRlePayload, maxUnc) {
  const maxLit = Math.min(Math.max(1, maxRlePayload - 1), 128);
  const rle = rleCompress(data, maxLit);
  const packets = [];
  let i = 0;
  let uncOff = 0;

  while (i < rle.length) {
    const start = i;
    let unc = 0;
    let rleBytes = 0;
    while (i < rle.length) {
      const c = rle[i];
      const codeLen = rleCodeLen(c);
      const codeUnc = rleCodeUncLen(c);
      if (rleBytes > 0 &&
          (rleBytes + codeLen > maxRlePayload || unc + codeUnc > maxUnc)) {
        break;
      }
      if (rleBytes === 0 && codeUnc > maxUnc) {
        break;
      }
      unc += codeUnc;
      rleBytes += codeLen;
      i += codeLen;
    }
    if (rleBytes === 0) {
      i += 1;
      continue;
    }
    packets.push({
      offset: uncOff,
      rle: rle.subarray(start, i),
      unc,
    });
    uncOff += unc;
  }
  return packets;
}

class PaintManager {
  constructor(canvas, ctx) {
    this.canvas = canvas;
    this.ctx = ctx;
    this.painting = false;
    this.lastX = 0;
    this.lastY = 0;
    this.brushColor = "#000000";
    this.brushSize = 2;
    this.currentTool = null;
    this.textElements = [];
    this.lineSegments = [];
    this.isTextPlacementMode = false;
    this.draggingCanvasContext = null;
    this.selectedTextElement = null;
    this.isDraggingText = false;
    this.dragOffsetX = 0;
    this.dragOffsetY = 0;
    this.textBold = false;
    this.textItalic = false;

    // Brush cursor indicator
    this.brushCursor = null;

    // Undo/Redo functionality
    this.historyStack = [];
    this.historyStep = -1;
    this.MAX_HISTORY = 50;

    // Bind event handlers
    this.startPaint = this.startPaint.bind(this);
    this.paint = this.paint.bind(this);
    this.endPaint = this.endPaint.bind(this);
    this.handleCanvasClick = this.handleCanvasClick.bind(this);
    this.onTouchStart = this.onTouchStart.bind(this);
    this.onTouchMove = this.onTouchMove.bind(this);
    this.onTouchEnd = this.onTouchEnd.bind(this);
    this.handleKeyboard = this.handleKeyboard.bind(this);
    this.updateBrushCursor = this.updateBrushCursor.bind(this);
    this.hideBrushCursor = this.hideBrushCursor.bind(this);
  }

  saveToHistory() {
    // Remove any states after current step (when user drew something after undoing)
    this.historyStack = this.historyStack.slice(0, this.historyStep + 1);

    // Save current canvas state along with text and line data
    const canvasState = {
      imageData: this.ctx.getImageData(0, 0, this.canvas.width, this.canvas.height),
      textElements: JSON.parse(JSON.stringify(this.textElements)),
      lineSegments: JSON.parse(JSON.stringify(this.lineSegments))
    };

    this.historyStack.push(canvasState);
    this.historyStep++;

    // Limit history size
    if (this.historyStack.length > this.MAX_HISTORY) {
      this.historyStack.shift();
      this.historyStep--;
    }

    this.updateUndoRedoButtons();
  }

  clearHistory() {
    this.historyStack = [];
    this.historyStep = -1;
    this.updateUndoRedoButtons();
  }

  undo() {
    if (this.historyStep > 0) {
      this.historyStep--;
      this.restoreFromHistory();
    }
  }

  redo() {
    if (this.historyStep < this.historyStack.length - 1) {
      this.historyStep++;
      this.restoreFromHistory();
    }
  }

  restoreFromHistory() {
    if (this.historyStep >= 0 && this.historyStep < this.historyStack.length) {
      const state = this.historyStack[this.historyStep];
      const w = state.imageData.width;
      const h = state.imageData.height;
      if (this.canvas.width !== w || this.canvas.height !== h) {
        this.canvas.width = w;
        this.canvas.height = h;
      }
      this.ctx.putImageData(state.imageData, 0, 0);
      this.textElements = JSON.parse(JSON.stringify(state.textElements));
      this.lineSegments = JSON.parse(JSON.stringify(state.lineSegments));
      this.updateUndoRedoButtons();
    }
  }

  updateUndoRedoButtons() {
    const canUndo = this.historyStep > 0;
    const canRedo = this.historyStep < this.historyStack.length - 1;
    const undoBtn = document.getElementById('undo-btn');
    const redoBtn = document.getElementById('redo-btn');
    if (undoBtn) undoBtn.disabled = !canUndo;
    if (redoBtn) redoBtn.disabled = !canRedo;
  }

  initPaintTools() {
    document.getElementById('brush-mode').addEventListener('click', () => {
      if (this.currentTool === 'brush') {
        this.setActiveTool(null, '');
      } else {
        this.setActiveTool('brush', '画笔模式');
        this.brushColor = document.getElementById('brush-color').value;
      }
    });

    document.getElementById('eraser-mode').addEventListener('click', () => {
      if (this.currentTool === 'eraser') {
        this.setActiveTool(null, '');
      } else {
        this.setActiveTool('eraser', '橡皮擦');
        this.brushColor = "#FFFFFF";
      }
    });

    document.getElementById('text-mode').addEventListener('click', () => {
      if (this.currentTool === 'text') {
        this.setActiveTool(null, '');
      } else {
        this.setActiveTool('text', '插入文字');
        this.brushColor = document.getElementById('brush-color').value;
      }
    });

    document.getElementById('brush-color').addEventListener('change', (e) => {
      this.brushColor = e.target.value;
    });

    document.getElementById('brush-size').addEventListener('input', (e) => {
      this.brushSize = parseInt(e.target.value);
      this.updateBrushCursorSize();
    });

    document.getElementById('add-text-btn').addEventListener('click', () => this.startTextPlacement());

    // Add event listeners for bold and italic buttons
    document.getElementById('text-bold').addEventListener('click', () => {
      this.textBold = !this.textBold;
      document.getElementById('text-bold').classList.toggle('primary', this.textBold);
    });

    document.getElementById('text-italic').addEventListener('click', () => {
      this.textItalic = !this.textItalic;
      document.getElementById('text-italic').classList.toggle('primary', this.textItalic);
    });

    // Add undo/redo button listeners
    document.getElementById('undo-btn').addEventListener('click', () => this.undo());
    document.getElementById('redo-btn').addEventListener('click', () => this.redo());

    this.canvas.addEventListener('mousedown', this.startPaint);
    this.canvas.addEventListener('mousemove', this.paint);
    this.canvas.addEventListener('mouseup', this.endPaint);
    this.canvas.addEventListener('mouseleave', this.endPaint);
    this.canvas.addEventListener('click', this.handleCanvasClick);

    // Touch support
    this.canvas.addEventListener('touchstart', this.onTouchStart);
    this.canvas.addEventListener('touchmove', this.onTouchMove);
    this.canvas.addEventListener('touchend', this.onTouchEnd);

    // Keyboard shortcuts for undo/redo
    document.addEventListener('keydown', this.handleKeyboard);

    // Mouse move for brush cursor
    this.canvas.addEventListener('mouseenter', this.updateBrushCursor);
    this.canvas.addEventListener('mousemove', this.updateBrushCursor);

    // Create brush cursor element
    this.createBrushCursor();

    // Initialize history with blank canvas state
    this.saveToHistory();
  }

  handleKeyboard(e) {
    // Ctrl+Z or Cmd+Z for undo
    if ((e.ctrlKey || e.metaKey) && e.key === 'z' && !e.shiftKey) {
      e.preventDefault();
      this.undo();
    }
    // Ctrl+Y or Ctrl+Shift+Z or Cmd+Shift+Z for redo
    else if ((e.ctrlKey || e.metaKey) && (e.key === 'y' || (e.shiftKey && e.key === 'z'))) {
      e.preventDefault();
      this.redo();
    }
  }

  setActiveTool(tool, title) {
    setCanvasTitle(title);
    this.currentTool = tool;

    this.canvas.parentNode.classList.toggle('brush-mode', this.currentTool === 'brush');
    this.canvas.parentNode.classList.toggle('eraser-mode', this.currentTool === 'eraser');
    this.canvas.parentNode.classList.toggle('text-mode', this.currentTool === 'text');

    document.getElementById('brush-mode').classList.toggle('active', this.currentTool === 'brush');
    document.getElementById('eraser-mode').classList.toggle('active', this.currentTool === 'eraser');
    document.getElementById('text-mode').classList.toggle('active', this.currentTool === 'text');

    document.getElementById('brush-color').disabled = this.currentTool === 'eraser';
    document.getElementById('brush-size').disabled = this.currentTool === 'text';

    // Cancel any pending text placement
    this.cancelTextPlacement();
  }

  createBrushCursor() {
    // Create a div element to show as brush cursor
    this.brushCursor = document.createElement('div');
    this.brushCursor.id = 'brush-cursor';
    this.brushCursor.style.position = 'fixed';
    this.brushCursor.style.border = '2px solid rgba(0, 0, 0, 0.5)';
    this.brushCursor.style.borderRadius = '50%';
    this.brushCursor.style.pointerEvents = 'none';
    this.brushCursor.style.display = 'none';
    this.brushCursor.style.zIndex = '10000';
    this.brushCursor.style.transform = 'translate(-50%, -50%)';
    this.brushCursor.style.willChange = 'transform';
    this.brushCursor.style.left = '0';
    this.brushCursor.style.top = '0';
    document.body.appendChild(this.brushCursor);
    this.updateBrushCursorSize();

    // For requestAnimationFrame throttling
    this.cursorUpdateScheduled = false;
    this.pendingCursorX = 0;
    this.pendingCursorY = 0;
  }

  updateBrushCursorSize() {
    if (!this.brushCursor) return;

    const rect = this.canvas.getBoundingClientRect();
    const scaleX = rect.width / this.canvas.width;
    const scaleY = rect.height / this.canvas.height;
    const scale = Math.min(scaleX, scaleY);

    const size = this.brushSize * scale;
    this.brushCursor.style.width = size + 'px';
    this.brushCursor.style.height = size + 'px';
  }

  updateBrushCursor(e) {
    if (!this.brushCursor) return;

    if (this.currentTool === 'brush' || this.currentTool === 'eraser') {
      // Check if mouse is within canvas bounds
      const rect = this.canvas.getBoundingClientRect();
      const isInCanvas = e.clientX >= rect.left && 
                         e.clientX <= rect.right && 
                         e.clientY >= rect.top && 
                         e.clientY <= rect.bottom;

      if (isInCanvas) {
        this.brushCursor.style.display = 'block';
        this.canvas.style.cursor = 'none';

        // Store the pending position
        this.pendingCursorX = e.clientX;
        this.pendingCursorY = e.clientY;

        // Schedule update using requestAnimationFrame for smooth movement
        if (!this.cursorUpdateScheduled) {
          this.cursorUpdateScheduled = true;
          requestAnimationFrame(() => {
            this.brushCursor.style.transform = `translate(${this.pendingCursorX}px, ${this.pendingCursorY}px) translate(-50%, -50%)`;
            this.cursorUpdateScheduled = false;
          });
        }

        // Update color to match brush or show white for eraser (only needs to happen once or when tool changes)
        if (this.currentTool === 'eraser') {
          if (this.brushCursor.getAttribute('data-tool') !== 'eraser') {
            this.brushCursor.style.border = '2px solid rgba(255, 0, 0, 0.7)';
            this.brushCursor.style.backgroundColor = 'rgba(255, 255, 255, 0.2)';
            this.brushCursor.style.boxShadow = 'none';
            this.brushCursor.setAttribute('data-tool', 'eraser');
          }
        } else {
          if (this.brushCursor.getAttribute('data-tool') !== 'brush') {
            // Use a contrasting border - white with black outline for visibility
            this.brushCursor.style.border = '1px solid white';
            this.brushCursor.style.boxShadow = '0 0 0 1px black, inset 0 0 0 1px black';
            this.brushCursor.style.backgroundColor = 'transparent';
            this.brushCursor.setAttribute('data-tool', 'brush');
          }
        }
      } else {
        // Hide cursor when outside canvas
        this.brushCursor.style.display = 'none';
      }
    }
  }

  hideBrushCursor() {
    if (this.brushCursor) {
      this.brushCursor.style.display = 'none';
    }
    this.canvas.style.cursor = 'default';
  }

  startPaint(e) {
    if (!this.currentTool) return;

    if (this.currentTool === 'text') {
      // Check if we're clicking on a text element to drag
      const textElement = this.findTextElementAt(e);
      if (textElement && textElement === this.selectedTextElement) {
        this.isDraggingText = true;

        const rect = this.canvas.getBoundingClientRect();
        const scaleX = this.canvas.width / rect.width;
        const scaleY = this.canvas.height / rect.height;
        const x = (e.clientX - rect.left) * scaleX;
        const y = (e.clientY - rect.top) * scaleY;

        // Calculate offset for smooth dragging
        this.dragOffsetX = textElement.x - x;
        this.dragOffsetY = textElement.y - y;

        return; // Don't start drawing
      }
    } else {
      this.painting = true;
      this.draw(e);
    }

  endPaint() {
    if (this.painting || this.isDraggingText) {
      this.saveToHistory(); // Save state after drawing or dragging text
    }
    this.painting = false;
    this.isDraggingText = false;
    this.lastX = 0;
    this.lastY = 0;

    this.hideBrushCursor();
  }

  paint(e) {
    if (!this.currentTool) return;

    if (this.currentTool === 'text') {
      if (this.isDraggingText && this.selectedTextElement) {
        this.dragText(e);
      }
    } else {
      if (this.painting) {
        this.draw(e);
      }
    }
  }

  draw(e) {
    const rect = this.canvas.getBoundingClientRect();
    const scaleX = this.canvas.width / rect.width;
    const scaleY = this.canvas.height / rect.height;
    const x = (e.clientX - rect.left) * scaleX;
    const y = (e.clientY - rect.top) * scaleY;

    this.ctx.lineJoin = 'round';
    this.ctx.lineCap = 'round';
    this.ctx.strokeStyle = this.brushColor;
    this.ctx.lineWidth = this.brushSize;

    this.ctx.beginPath();

    if (this.lastX === 0 && this.lastY === 0) {
      // For the first point, just do a dot
      this.ctx.moveTo(x, y);
      this.ctx.lineTo(x + 0.1, y + 0.1);

      // Store the dot for redrawing
      this.lineSegments.push({
        type: 'dot',
        x: x,
        y: y,
        color: this.brushColor,
        size: this.brushSize
      });

      // Connect to the previous point
      this.ctx.moveTo(this.lastX, this.lastY);
      this.ctx.lineTo(x, y);

      // Store the line segment for redrawing
      this.lineSegments.push({
        type: 'line',
        x1: this.lastX,
        y1: this.lastY,
        x2: x,
        y2: y,
        color: this.brushColor,
        size: this.brushSize
      });

    this.lastX = x;
    this.lastY = y;

  handleCanvasClick(e) {
    if (this.currentTool === 'text' && this.isTextPlacementMode) {

  onTouchStart(e) {

    if (this.currentTool === 'text' && this.isTextPlacementMode) {

    const mouseEvent = new MouseEvent('mousedown', {

      clientY: touch.clientY

    this.canvas.dispatchEvent(mouseEvent);

  onTouchMove(e) {
    e.preventDefault();
    const touch = e.touches[0];
    const mouseEvent = new MouseEvent('mousemove', {
      clientX: touch.clientX,
      clientY: touch.clientY
    });
    this.canvas.dispatchEvent(mouseEvent);
  }

  onTouchEnd(e) {
    e.preventDefault();
    this.endPaint();
  }

  dragText(e) {
    const rect = this.canvas.getBoundingClientRect();
    const scaleX = this.canvas.width / rect.width;
    const scaleY = this.canvas.height / rect.height;
    const x = (e.clientX - rect.left) * scaleX;
    const y = (e.clientY - rect.top) * scaleY;

    // Update text position with offset
    this.selectedTextElement.x = x + this.dragOffsetX;
    this.selectedTextElement.y = y + this.dragOffsetY;

    // Redraw selected text element
    if (this.draggingCanvasContext) {
      this.ctx.putImageData(this.draggingCanvasContext, 0, 0);
    } else {
      this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);
    }
    this.ctx.font = this.selectedTextElement.font;
    this.ctx.fillStyle = this.selectedTextElement.color;
    this.ctx.fillText(this.selectedTextElement.text, this.selectedTextElement.x, this.selectedTextElement.y);
  }

  findTextElementAt(e) {
    const rect = this.canvas.getBoundingClientRect();
    const scaleX = this.canvas.width / rect.width;
    const scaleY = this.canvas.height / rect.height;
    const x = (e.clientX - rect.left) * scaleX;
    const y = (e.clientY - rect.top) * scaleY;

    // Search through text elements in reverse order (top-most first)
    for (let i = this.textElements.length - 1; i >= 0; i--) {
      const text = this.textElements[i];

      // Calculate text dimensions
      this.ctx.font = text.font;
      const textWidth = this.ctx.measureText(text.text).width;

      // Extract font size correctly from the font string
      const fontSizeMatch = text.font.match(/(\d+)px/);
      const fontSize = fontSizeMatch ? parseInt(fontSizeMatch[1]) : 14;
      const textHeight = fontSize * 1.2; // Approximate height

      // Check if click is within text bounds (allowing for some margin)
      const margin = 5;
      if (x >= text.x - margin &&
        x <= text.x + textWidth + margin &&
        y >= text.y - textHeight + margin &&
        y <= text.y + margin) {
        return text;
      }
    }

    return null;
  }

  startTextPlacement() {
    const text = document.getElementById('text-input').value.trim();
    if (!text) {
      if (typeof appAlert === 'function') appAlert('请输入文字内容', '提示');
      else alert('请输入文字内容');
      return;
    }

    this.isTextPlacementMode = true;

    // Add visual feedback
    setCanvasTitle('点击画布放置文字');
    this.canvas.classList.add('text-placement-mode');
  }

  cancelTextPlacement() {
    this.isTextPlacementMode = false;
    this.canvas.classList.remove('text-placement-mode');

    // reset dragging state
    this.isDraggingText = false;
    this.dragOffsetX = 0;
    this.dragOffsetY = 0;
    this.selectedTextElement = null;
    this.draggingCanvasContext = null;
  }

  placeText(e) {
    const rect = this.canvas.getBoundingClientRect();
    const scaleX = this.canvas.width / rect.width;
    const scaleY = this.canvas.height / rect.height;
    const x = (e.clientX - rect.left) * scaleX;
    const y = (e.clientY - rect.top) * scaleY;

    const text = document.getElementById('text-input').value;
    const fontFamily = document.getElementById('font-family').value;
    const fontSize = document.getElementById('font-size').value;

    // Build font style string
    let fontStyle = '';
    if (this.textItalic) fontStyle += 'italic ';
    if (this.textBold) fontStyle += 'bold ';

    // Create a new text element
    const newText = {
      text: text,
      x: x,
      y: y,
      font: `${fontStyle}${fontSize}px ${fontFamily}`,
      color: this.brushColor
    };

    // Add to our list of text elements
    this.textElements.push(newText);

    // Select this text element for immediate dragging
    this.selectedTextElement = newText;
    this.draggingCanvasContext = this.ctx.getImageData(0, 0, this.canvas.width, this.canvas.height);

    // Draw text on canvas
    this.ctx.font = newText.font;
    this.ctx.fillStyle = newText.color;
    this.ctx.fillText(newText.text, newText.x, newText.y);

    // Save to history after placing text
    this.saveToHistory();

    // Reset
    document.getElementById('text-input').value = '';
    this.isTextPlacementMode = false;
    this.canvas.classList.remove('text-placement-mode');
    setCanvasTitle('拖动新添加文字可调整位置');
  }

  redrawTextElements() {
    // Redraw all text elements after dithering
    this.textElements.forEach(item => {
      this.ctx.font = item.font;
      this.ctx.fillStyle = item.color;
      this.ctx.fillText(item.text, item.x, item.y);
    });
  }

  redrawLineSegments() {
    // Redraw all line segments after dithering
    this.lineSegments.forEach(segment => {
      this.ctx.lineJoin = 'round';
      this.ctx.lineCap = 'round';
      this.ctx.strokeStyle = segment.color;
      this.ctx.lineWidth = segment.size;
      this.ctx.beginPath();

      if (segment.type === 'dot') {
        this.ctx.moveTo(segment.x, segment.y);
        this.ctx.lineTo(segment.x + 0.1, segment.y + 0.1);
      } else {
        this.ctx.moveTo(segment.x1, segment.y1);
        this.ctx.lineTo(segment.x2, segment.y2);
      }

      this.ctx.stroke();
    });
  }

  clearElements() {
    this.textElements = [];
    this.lineSegments = [];
  }
}

	<script type="text/javascript">
class CropManager {
  constructor(canvas, ctx) {
    this.canvas = canvas;
    this.ctx = ctx;
    this.backgroundZoom = 1;
    this.backgroundPanX = 0;
    this.backgroundPanY = 0;
    this.isPanning = false;
    this.lastPanX = 0;
    this.lastPanY = 0;
    this.lastTouchDistance = 0;

    // Bind event handlers
    this.handleBackgroundZoom = this.handleBackgroundZoom.bind(this);
    this.handleBackgroundPanStart = this.handleBackgroundPanStart.bind(this);
    this.handleBackgroundPan = this.handleBackgroundPan.bind(this);
    this.handleBackgroundPanEnd = this.handleBackgroundPanEnd.bind(this);
    this.handleTouchStart = this.handleTouchStart.bind(this);
    this.handleTouchMove = this.handleTouchMove.bind(this);
  }

  resetStates() {
    this.backgroundZoom = 1;
    this.backgroundPanX = 0;
    this.backgroundPanY = 0;
    this.isPanning = false;
    this.lastPanX = 0;
    this.lastPanY = 0;
    this.lastTouchDistance = 0;
  }

  isCropMode() {
    return this.canvas.parentNode.classList.contains('crop-mode');
  }

  exitCropMode() {
    this.canvas.parentNode.classList.remove('crop-mode');
    setCanvasTitle("");

    this.canvas.removeEventListener('wheel', this.handleBackgroundZoom);
    this.canvas.removeEventListener('mousedown', this.handleBackgroundPanStart);
    this.canvas.removeEventListener('mousemove', this.handleBackgroundPan);
    this.canvas.removeEventListener('mouseup', this.handleBackgroundPanEnd);
    this.canvas.removeEventListener('mouseleave', this.handleBackgroundPanEnd);
    this.canvas.removeEventListener('touchstart', this.handleTouchStart);
    this.canvas.removeEventListener('touchmove', this.handleTouchMove);
    this.canvas.removeEventListener('touchend', this.handleBackgroundPanEnd);
    this.canvas.removeEventListener('touchcancel', this.handleBackgroundPanEnd);
  }

  initializeCrop() {
    const imageFile = document.getElementById('imageFile');
    if (imageFile.files.length == 0) {
      fillCanvas('white');
      return;
    }

    this.exitCropMode();
    this.resetStates();

    this.canvas.style.backgroundImage = `url(${URL.createObjectURL(imageFile.files[0])})`;
    this.canvas.style.backgroundSize = '100%';
    this.canvas.style.backgroundPosition = '';
    this.canvas.style.backgroundRepeat = 'no-repeat';

    // add event listeners for zoom and pan
    this.canvas.addEventListener('wheel', this.handleBackgroundZoom);
    this.canvas.addEventListener('mousedown', this.handleBackgroundPanStart);
    this.canvas.addEventListener('mousemove', this.handleBackgroundPan);
    this.canvas.addEventListener('mouseup', this.handleBackgroundPanEnd);
    this.canvas.addEventListener('mouseleave', this.handleBackgroundPanEnd);

    // Touch events for mobile devices
    this.canvas.addEventListener('touchstart', this.handleTouchStart);
    this.canvas.addEventListener('touchmove', this.handleTouchMove);
    this.canvas.addEventListener('touchend', this.handleBackgroundPanEnd);
    this.canvas.addEventListener('touchcancel', this.handleBackgroundPanEnd);

    // Make the canvas transparent
    this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);

    setCanvasTitle("裁剪模式: 可用鼠标滚轮或双指触摸缩放图片");
    this.canvas.parentNode.classList.add('crop-mode');
  }

  finishCrop(callback) {
    const imageFile = document.getElementById('imageFile');
    if (imageFile.files.length == 0) return;

    const image = new Image();
    image.onload = () => {
      URL.revokeObjectURL(image.src);

      const fieldsetRect = this.canvas.getBoundingClientRect();
      const scale = (image.width / fieldsetRect.width) / this.backgroundZoom;

      const sx = -this.backgroundPanX * scale;
      const sy = -this.backgroundPanY * scale;
      const sWidth = fieldsetRect.width * scale;
      const sHeight = fieldsetRect.height * scale;

      fillCanvas('white');
      this.ctx.drawImage(image, sx, sy, sWidth, sHeight, 0, 0, this.canvas.width, this.canvas.height);

      this.exitCropMode();
      if (callback) callback();
    };
    image.src = URL.createObjectURL(imageFile.files[0]);
  }

  handleTouchStart(e) {
    e.preventDefault();
    if (e.touches.length === 1) {
      this.handleBackgroundPanStart(e.touches[0]);
    } else if (e.touches.length === 2) {
      this.isPanning = false; // Stop panning when zooming
      this.lastTouchDistance = this.getTouchDistance(e.touches);
    }
  }

  handleTouchMove(e) {
    e.preventDefault();
    if (this.isPanning && e.touches.length === 1) {
      this.handleBackgroundPan(e.touches[0]);
    } else if (e.touches.length === 2) {
      const newDist = this.getTouchDistance(e.touches);
      if (this.lastTouchDistance > 0) {
        const zoomFactor = newDist / this.lastTouchDistance;
        this.backgroundZoom *= zoomFactor;
        this.backgroundZoom = Math.max(0.1, Math.min(5, this.backgroundZoom)); // Limit zoom range
        this.updateBackgroundTransform();
      }
      this.lastTouchDistance = newDist;
    }
  }

  handleBackgroundZoom(e) {
    e.preventDefault();
    const zoomFactor = e.deltaY > 0 ? 0.9 : 1.1;
    this.backgroundZoom *= zoomFactor;
    this.backgroundZoom = Math.max(0.1, Math.min(5, this.backgroundZoom)); // Limit zoom range
    this.updateBackgroundTransform();
  }

  handleBackgroundPanStart(e) {
    this.isPanning = true;
    this.lastPanX = e.clientX;
    this.lastPanY = e.clientY;
    this.canvas.style.cursor = 'grabbing';
  }

  handleBackgroundPan(e) {
    if (this.isPanning) {
      const deltaX = e.clientX - this.lastPanX;
      const deltaY = e.clientY - this.lastPanY;
      this.backgroundPanX += deltaX;
      this.backgroundPanY += deltaY;
      this.lastPanX = e.clientX;
      this.lastPanY = e.clientY;
      this.updateBackgroundTransform();
    }
  }

  handleBackgroundPanEnd() {
    this.isPanning = false;
    this.lastTouchDistance = 0; // Reset touch distance
    this.canvas.style.cursor = 'grab';
  }

  updateBackgroundTransform() {
    this.canvas.style.backgroundSize = `${100 * this.backgroundZoom}%`;
    this.canvas.style.backgroundPosition = `${this.backgroundPanX}px ${this.backgroundPanY}px`;
  }

  getTouchDistance(touches) {
    const touch1 = touches[0];
    const touch2 = touches[1];
    return Math.sqrt(
      Math.pow(touch2.clientX - touch1.clientX, 2) +
      Math.pow(touch2.clientY - touch1.clientY, 2)
    );
  }

  initCropTools() {
    document.getElementById('crop-zoom-in').addEventListener('click', (e) => {
      e.preventDefault();
      this.handleBackgroundZoom({ preventDefault: () => { }, deltaY: -1 });
    });

    document.getElementById('crop-zoom-out').addEventListener('click', (e) => {
      e.preventDefault();
      this.handleBackgroundZoom({ preventDefault: () => { }, deltaY: 1 });
    });

    document.getElementById('crop-move-left').addEventListener('click', (e) => {
      e.preventDefault();
      this.backgroundPanX -= 10;
      this.updateBackgroundTransform();
    });

    document.getElementById('crop-move-right').addEventListener('click', (e) => {
      e.preventDefault();
      this.backgroundPanX += 10;
      this.updateBackgroundTransform();
    });

    document.getElementById('crop-move-up').addEventListener('click', (e) => {
      e.preventDefault();
      this.backgroundPanY -= 10;
      this.updateBackgroundTransform();
    });

    document.getElementById('crop-move-down').addEventListener('click', (e) => {
      e.preventDefault();
      this.backgroundPanY += 10;
      this.updateBackgroundTransform();
    });
  }
}

	<script type="text/javascript">
let bleDevice, gattServer;
let epdService, epdCharacteristic;
let startTime, msgIndex, appVersion;
let canvas, ctx, textDecoder;
let paintManager, cropManager;
let rleSupport;
var flashOpActive = false;
var epdSending = false;
var gattWriteChain = Promise.resolve();
let reconnecting = false;
let appModalResolver = null;
var negotiatedMaxDataLen = 0;
let debugCalendarCurrentDate = new Date();
let debugCalendarSelectedDate = new Date();
var deviceInfo = { modelId: null, width: 400, height: 300, voltageMv: null, fwBuild: 0, spiFlashSize: 0, jedec: '', calTheme: false, calTile: false };

function onEpdCharacteristicNotify(event) {
  handleNotify(event.target.value, msgIndex++);
}

const EpdCmd = {
  SET_PINS: 0x00,
  INIT: 0x01,
  CLEAR: 0x02,
  SEND_CMD: 0x03,
  SEND_DATA: 0x04,
  REFRESH: 0x05,
  SLEEP: 0x06,

  SET_TIME: 0x20,
  GET_VOLTAGE: 0x22,
  PANEL_CLEAN: 0x23,
  HOLIDAY: 0x24,
  BLE_ALWAYS: 0x25,
  SET_CALENDAR_THEME: 0x26,
  SET_MODE_THEME: 0x27,
  COUNTDOWN: 0x28,
  CAL_TILE: 0x29,

  WRITE_IMG: 0x30, // v1.6

  FLASH_DATA: 0x41,
  FLASH_END: 0x42,
  FLASH_ERASE: 0x47,
  HZK_BEGIN: 0x4B,
  IMG_BEGIN: 0x4E,
  IMG_SHOW: 0x4F,
  IMG_DELETE: 0x50,
  IMG_INFO: 0x51,
  IMG_READ: 0x52,
  IMG_CAROUSEL: 0x53,
  CAL_TILE_BEGIN: 0x54,
  CAL_TILE_READ: 0x55,
  USER_CLEAR: 0x56,

  SET_CONFIG: 0x90,
  SYS_RESET: 0x91,
  SYS_SLEEP: 0x92,
  CFG_ERASE: 0x99,
};

const COUNTDOWN_MAX = 32;
const COUNTDOWN_ROWS_MIN = 1;

const canvasSizes = [
  { name: '4.2_400_300', width: 400, height: 300 },
  { name: '5.83_600_448', width: 600, height: 448 },
  { name: '5.83_648_480', width: 648, height: 480 },
  { name: '7.5_640_384', width: 640, height: 384 },
  { name: '7.5_800_480', width: 800, height: 480 },
  { name: '7.5_880_528', width: 880, height: 528 },
];

function hex2bytes(hex) {
  for (var bytes = [], c = 0; c < hex.length; c += 2)
    bytes.push(parseInt(hex.substr(c, 2), 16));
  return new Uint8Array(bytes);
}

function bytes2hex(data) {
  return new Uint8Array(data).reduce(
    function (memo, i) {
      return memo + ("0" + i.toString(16)).slice(-2);
    }, "");
}

function intToHex(intIn) {
  let stringOut = ("0000" + intIn.toString(16)).substr(-4)
  return stringOut.substring(2, 4) + stringOut.substring(0, 2);
}

function resetVariables() {
  gattServer = null;
  epdService = null;
  epdCharacteristic = null;
  msgIndex = 0;
  rleSupport = false;
  if (typeof negotiatedMaxDataLen !== 'undefined') negotiatedMaxDataLen = 0;
  if (typeof resetImgSlotUi === 'function') resetImgSlotUi();
  if (typeof calBgReset === 'function') calBgReset();
  const spiInfo = document.getElementById('spiFlashInfo');
  if (spiInfo) {
    spiInfo.hidden = true;
    spiInfo.textContent = '';
  }
  if (deviceInfo) {
    deviceInfo.spiFlashSize = 0;
    deviceInfo.jedec = '';
    deviceInfo.calTheme = false;
    deviceInfo.calTile = false;
  }
  if (typeof updateCalFeatureUi === 'function') updateCalFeatureUi();
  document.getElementById("log").value = '';
}

function closeAppModal(result) {
  const modal = document.getElementById('appModal');
  if (!modal) return;
  modal.hidden = true;
  const resolve = appModalResolver;
  appModalResolver = null;
  if (resolve) resolve(result);
}

function appConfirm(message, title = '确认') {
  return new Promise((resolve) => {
    const modal = document.getElementById('appModal');
    if (!modal) {
      resolve(window.confirm(String(message)));
      return;
    }
    if (appModalResolver) closeAppModal(false);
    document.getElementById('appModalTitle').textContent = title;
    document.getElementById('appModalMsg').textContent = message;
    document.getElementById('appModalCancel').hidden = false;
    appModalResolver = resolve;
    modal.hidden = false;
  });
}

function appAlert(message, title = '提示') {
  return new Promise((resolve) => {
    const modal = document.getElementById('appModal');
    if (!modal) {
      window.alert(String(message));
      resolve(true);
      return;
    }
    if (appModalResolver) closeAppModal(false);
    document.getElementById('appModalTitle').textContent = title;
    document.getElementById('appModalMsg').textContent = message;
    document.getElementById('appModalCancel').hidden = true;
    appModalResolver = resolve;
    modal.hidden = false;
  });
}

function initAppModal() {
  const modal = document.getElementById('appModal');
  if (!modal) return;
  document.getElementById('appModalOk').onclick = () => closeAppModal(true);
  document.getElementById('appModalCancel').onclick = () => closeAppModal(false);
  modal.querySelectorAll('[data-modal-dismiss]').forEach((el) => {
    el.addEventListener('click', () => closeAppModal(false));
  });
  document.addEventListener('keydown', (e) => {
    if (!modal || modal.hidden) return;
    if (e.key === 'Escape') {
      e.preventDefault();
      closeAppModal(false);
    } else if (e.key === 'Enter' && !e.repeat) {
      e.preventDefault();
      closeAppModal(true);
    }
  });
}

function checkBluetoothConnection() {
  if (!bleDevice || !bleDevice.gatt || !bleDevice.gatt.connected) {
    addLog("错误：蓝牙设备未连接");
    return false;
  }
  return true;
}

async function write(cmd, data, withResponse = true) {
  if (!epdCharacteristic) {
    addLog("服务不可用，请检查蓝牙连接");
    return false;
  }
  const run = async () => {
    let payload = [cmd];
    if (data) {
      if (typeof data == 'string') data = hex2bytes(data);
      if (data instanceof Uint8Array) data = Array.from(data);
      payload.push(...data);
    }
    if (cmd !== EpdCmd.FLASH_DATA && cmd !== EpdCmd.WRITE_IMG && cmd !== EpdCmd.COUNTDOWN &&
        cmd !== EpdCmd.CAL_TILE) {
      addLog(bytes2hex(payload), '⇑');
    }
    try {
      if (withResponse)
        await epdCharacteristic.writeValueWithResponse(Uint8Array.from(payload));
      else
        await epdCharacteristic.writeValueWithoutResponse(Uint8Array.from(payload));
    } catch (e) {
      console.error(e);
      if (e.message) addLog("write: " + e.message);
      return false;
    }
    return true;
  };
  const p = gattWriteChain.then(run, run);
  gattWriteChain = p.then(() => undefined, () => undefined);
  return p;
}

async function sleepMs(ms) {
  await new Promise((r) => setTimeout(r, ms));
}

function attPayloadMtu() {
  const mtuEl = document.getElementById('mtusize');
  const inputMtu = parseInt(mtuEl && mtuEl.value, 10);
  return Math.max(20, negotiatedMaxDataLen | 0, Number.isFinite(inputMtu) ? inputMtu : 0);
}

async function ensureImageMtuReady(timeoutMs = 5000) {
  const t0 = Date.now();
  while (negotiatedMaxDataLen < 20 && Date.now() - t0 < timeoutMs) {
    await sleepMs(50);
  }
  if (negotiatedMaxDataLen < 20) {
    negotiatedMaxDataLen = 20;
  }
  const mtu = attPayloadMtu();
  const mtuEl = document.getElementById('mtusize');
  if (mtuEl && mtu > (parseInt(mtuEl.value, 10) || 0)) {
    mtuEl.value = mtu;
  }
  return mtu;
}

async function gattWriteBytes(bytes, withResponse) {
  if (!epdCharacteristic) {
    addLog("服务不可用，请检查蓝牙连接");
    return false;
  }
  const run = async () => {
    try {
      if (withResponse) {
        await epdCharacteristic.writeValueWithResponse(bytes);
      } else {
        await epdCharacteristic.writeValueWithoutResponse(bytes);
      }
      return true;
    } catch (e) {
      if (!withResponse) {
        try {
          await sleepMs(8);
          await epdCharacteristic.writeValueWithoutResponse(bytes);
          return true;
        } catch (_) {
          try {
            await epdCharacteristic.writeValueWithResponse(bytes);
            return true;
          } catch (e2) {
            console.error(e2);
            if (e2.message) addLog("write: " + e2.message);
            return false;
          }
        }
      }
      console.error(e);
      if (e.message) addLog("write: " + e.message);
      return false;
    }
  };
  const p = gattWriteChain.then(run, run);
  gattWriteChain = p.then(() => undefined, () => undefined);
  return p;
}

async function writeImage(data, step = 'bw') {
  const chunkSize = Math.max(1, attPayloadMtu() - 2);
  const interleavedCount = parseInt(document.getElementById('interleavedcount').value, 10) || 50;
  let noReplyCount = interleavedCount;
  const stepText = step === 'bw' ? '数据块' : '红色块';

  const rleChunks = rleSupport ? rleCompressMTU(data, chunkSize) : null;
  const rleLength = rleChunks ? rleChunks.reduce((total, chunk) => total + chunk.length, 0) : data.length;
  const useRle = rleSupport && rleLength < data.length;
  const totalChunks = useRle ? rleChunks.length : Math.ceil(data.length / chunkSize);

  for (let i = 0; i < totalChunks; i++) {
    const raw = useRle ? rleChunks[i] : data.slice(i * chunkSize, i * chunkSize + chunkSize);
    const chunk = raw instanceof Uint8Array ? raw : Uint8Array.from(raw);
    if (i === 0 || i === totalChunks - 1 || (i % 8) === 0) {
      const currentTime = (new Date().getTime() - startTime) / 1000.0;
      setStatus(`${stepText}: ${i + 1}/${totalChunks}${useRle ? ' RLE' : ''}, 总用时: ${currentTime}s`);
    }
    const flag = rleSupport
      ? ((step === 'bw' ? 0x00 : 0x01) | (i === 0 ? 0x02 : 0x00) | (useRle ? 0x04 : 0x00))
      : ((step === 'bw' ? 0x0F : 0x00) | (i === 0 ? 0x00 : 0xF0));
    const pkt = new Uint8Array(2 + chunk.length);
    pkt[0] = EpdCmd.WRITE_IMG;
    pkt[1] = flag;
    pkt.set(chunk, 2);
    const needAck = (i === totalChunks - 1) || (noReplyCount <= 0);
    if (!await gattWriteBytes(pkt, needAck)) return false;
    if (needAck) {
      noReplyCount = interleavedCount;
    } else {
      noReplyCount--;
    }
  }
  return true;
}

function setPinsPayload() {
  let pins = document.getElementById("epdpins").value;
  if (typeof pins === 'string') pins = hex2bytes(pins || '');
  const bytes = Array.from(pins);
  while (bytes.length < 8) bytes.push(0xFF);
  const keyEl = document.getElementById("epdkeypin");
  const key = keyEl ? parseInt(keyEl.value, 10) : NaN;
  if (Number.isFinite(key) && key >= 0 && key <= 31) {
    bytes.push(key & 0xFF);
  }
  return bytes;
}

async function setDriver() {
  await write(EpdCmd.SET_PINS, setPinsPayload());
  await write(EpdCmd.INIT, document.getElementById("epddriver").value);
}

async function syncTime(mode) {
  if (mode === 2) mode = 1;
  const timestamp = new Date().getTime() / 1000;
  const data = new Uint8Array([
    (timestamp >> 24) & 0xFF,
    (timestamp >> 16) & 0xFF,
    (timestamp >> 8) & 0xFF,
    timestamp & 0xFF,
    -(new Date().getTimezoneOffset() / 60),
    mode
  ]);
  if (await write(EpdCmd.SET_TIME, data)) {
    if (typeof imgClearDisplayedSlot === 'function') imgClearDisplayedSlot();
    addLog("时间已同步！");
    addLog("屏幕刷新完成前请不要操作。");
  }
}

function showDebugCalendar() {
  debugCalendarCurrentDate = new Date();
  debugCalendarSelectedDate = new Date();
  updateCalendarDisplay();
  document.getElementById('debugCalendarModal').style.display = 'flex';
}

function closeDebugCalendar() {
  document.getElementById('debugCalendarModal').style.display = 'none';
}

function changeMonth(direction) {
  debugCalendarCurrentDate.setMonth(debugCalendarCurrentDate.getMonth() + direction);
  updateCalendarDisplay();
}

function updateCalendarDisplay() {
  const monthNames = ['一月', '二月', '三月', '四月', '五月', '六月',
                     '七月', '八月', '九月', '十月', '十一月', '十二月'];
  document.getElementById('currentMonthYear').textContent =
    `${debugCalendarCurrentDate.getFullYear()}年 ${monthNames[debugCalendarCurrentDate.getMonth()]}`;
  const calendarDays = document.getElementById('calendarDays');
  calendarDays.innerHTML = '';
  const year = debugCalendarCurrentDate.getFullYear();
  const month = debugCalendarCurrentDate.getMonth();
  const today = new Date();
  const firstDay = new Date(year, month, 1);
  const lastDay = new Date(year, month + 1, 0);
  const daysInMonth = lastDay.getDate();
  const startDayOfWeek = firstDay.getDay();
  for (let i = 0; i < startDayOfWeek; i++) {
    const prevMonth = new Date(year, month, -startDayOfWeek + i + 1);
    calendarDays.appendChild(createDayElement(prevMonth.getDate(), true, false, false));
  }
  for (let day = 1; day <= daysInMonth; day++) {
    const currentDate = new Date(year, month, day);
    const isToday = currentDate.toDateString() === today.toDateString();
    const isSelected = currentDate.toDateString() === debugCalendarSelectedDate.toDateString();
    const dayElement = createDayElement(day, false, isToday, isSelected);
    dayElement.onclick = () => selectDate(currentDate);
    calendarDays.appendChild(dayElement);
  }
  const remainingCells = 42 - (startDayOfWeek + daysInMonth);
  for (let i = 1; i <= remainingCells; i++) {
    const nextMonth = new Date(year, month + 1, i);
    calendarDays.appendChild(createDayElement(nextMonth.getDate(), true, false, false));
  }
}

function createDayElement(day, isOtherMonth, isToday, isSelected) {
  const dayElement = document.createElement('div');
  dayElement.className = 'debug-cal-day';
  dayElement.textContent = day;
  if (isOtherMonth) dayElement.classList.add('other-month');
  if (isToday) dayElement.classList.add('today');
  if (isSelected) dayElement.classList.add('selected');
  return dayElement;
}

function selectDate(date) {
  debugCalendarSelectedDate = new Date(date);
  updateCalendarDisplay();
}

async function syncCustomDate() {
  const now = new Date();
  const customDate = new Date(
    debugCalendarSelectedDate.getFullYear(),
    debugCalendarSelectedDate.getMonth(),
    debugCalendarSelectedDate.getDate(),
    now.getHours(),
    now.getMinutes(),
    now.getSeconds()
  );
  const timestamp = customDate.getTime() / 1000;
  const data = new Uint8Array([
    (timestamp >> 24) & 0xFF,
    (timestamp >> 16) & 0xFF,
    (timestamp >> 8) & 0xFF,
    timestamp & 0xFF,
    -(new Date().getTimezoneOffset() / 60),
    1
  ]);
  if (await write(EpdCmd.SET_TIME, data)) {
    if (typeof imgClearDisplayedSlot === 'function') imgClearDisplayedSlot();
    addLog(`调试日期已同步：${customDate.toLocaleString()}`);
    closeDebugCalendar();
  }
}

function pad2(n) {
  return String(n).padStart(2, '0');
}

function ensureCountdownRow(i) {
  const host = document.getElementById('countdownRows');
  if (!host || i < 0 || i >= COUNTDOWN_MAX) return;
  for (let k = 0; k <= i; k++) {
    if (document.getElementById('cdDate' + k)) continue;
    const row = document.createElement('div');
    row.className = 'flex-group cd-row';
    row.innerHTML =
      `<span>${k + 1}.</span>` +
      `<input id="cdDate${k}" type="date">` +
      `<input id="cdName${k}" type="text" maxlength="6" value="" placeholder="名称">` +
      `<button type="button" class="secondary cd-del-btn" onclick="deleteCountdownRow(${k})">删除</button>`;
    host.appendChild(row);
    bindDateInputPicker(document.getElementById('cdDate' + k));
  }
}

function initCountdownRows() {
  bindDateInputPicker(document.getElementById('cdFocusDate'));
  const host = document.getElementById('countdownRows');
  if (!host || host.childElementCount > 0) return;
  for (let i = 0; i < COUNTDOWN_ROWS_MIN; i++) ensureCountdownRow(i);
}

function resetCountdownRows() {
  const host = document.getElementById('countdownRows');
  if (!host) return;
  host.innerHTML = '';
  ensureCountdownRow(0);
}

function countdownRowCount() {
  let n = 0;
  while (n < COUNTDOWN_MAX && document.getElementById('cdDate' + n)) n++;
  return n;
}

function collectCountdownItems() {
  const items = [];
  const n = countdownRowCount();
  for (let i = 0; i < n; i++) {
    const row = countdownFieldPair('cdDate' + i, 'cdName' + i);
    if (row.date || row.name) items.push(row);
  }
  return items;
}

function fillCountdownItems(items) {
  resetCountdownRows();
  for (let i = 0; i < items.length; i++) {
    ensureCountdownRow(i);
    const dateEl = document.getElementById('cdDate' + i);
    const nameEl = document.getElementById('cdName' + i);
    if (dateEl) dateEl.value = items[i].date || '';
    if (nameEl) nameEl.value = items[i].name || '';
  }
}

async function addCountdownRow() {
  let n = countdownRowCount();
  if (n >= COUNTDOWN_MAX) {
    await appAlert('最多 32 条自定义倒数日', '倒数日');
    return;
  }
  ensureCountdownRow(n);
  if (typeof updateButtonStatus === 'function') updateButtonStatus();
}

function clipChars(s, n) {
  return Array.from(String(s || '')).slice(0, n).join('');
}

function gb2312NameBytes(text, maxChars) {
  if (typeof Gb2312Enc === 'undefined') {
    throw Object.assign(new Error('缺少 GB2312 编码器'), { code: 'NO_GB2312' });
  }
  const clipped = clipChars(text, maxChars);
  return Array.from(Gb2312Enc.utf8ToGb2312Bytes(clipped));
}

function decodeCdName(s) {
  const t = String(s || '');
  if (typeof Gb2312Enc !== 'undefined' && /^[0-9A-Fa-f]*$/.test(t) && (t.length % 2) === 0) {
    if (t.length === 0) return '';
    const bytes = [];
    for (let i = 0; i < t.length; i += 2) bytes.push(parseInt(t.slice(i, i + 2), 16));
    return Gb2312Enc.gb2312BytesToUtf8(Uint8Array.from(bytes));
  }
  return t;
}

function clearFocusForm() {
  const dateEl = document.getElementById('cdFocusDate');
  if (dateEl) dateEl.value = '';
  const nameEl = document.getElementById('cdFocusName');
  if (nameEl) nameEl.value = '';
}

function applyFocusItem(payload) {
  const raw = String(payload || '').trim();
  if (!raw) {
    clearFocusForm();
    return;
  }
  const parts = raw.split(',');
  if (parts.length < 4) return;
  const dateEl = document.getElementById('cdFocusDate');
  const nameEl = document.getElementById('cdFocusName');
  if (!dateEl) return;
  const year = parseInt(parts[0], 10) || 0;
  const mon = parseInt(parts[1], 10) || 0;
  const day = parseInt(parts[2], 10) || 0;
  if (mon >= 1 && day >= 1 && year >= 2000) {
    dateEl.value = `${year}-${pad2(mon)}-${pad2(day)}`;
  } else {
    dateEl.value = '';
  }
  if (nameEl) nameEl.value = decodeCdName(parts.slice(3).join(','));
}

function countdownPayloadBytes(idx, maxChars, dateId, nameId) {
  const dateEl = document.getElementById(dateId);
  const nameEl = document.getElementById(nameId);
  const name = (nameEl && nameEl.value) ? clipChars(nameEl.value, maxChars) : '';
  let year = 0;
  let mon = 0;
  let day = 0;
  if (dateEl && dateEl.value) {
    const bits = dateEl.value.split('-');
    year = parseInt(bits[0], 10) || 0;
    mon = parseInt(bits[1], 10) || 0;
    day = parseInt(bits[2], 10) || 0;
  }
  const enc = gb2312NameBytes(name, maxChars);
  const bytes = [idx, year & 0xFF, (year >> 8) & 0xFF, mon & 0xFF, day & 0xFF];
  const maxName = maxChars * 2;
  for (let n = 0; n < enc.length && n < maxName; n++) bytes.push(enc[n]);
  return bytes;
}

function applyCountdownItem(payload) {
  const parts = String(payload).split(',');
  if (parts.length < 5) return;
  const idx = parseInt(parts[0], 10);
  if (!Number.isFinite(idx) || idx < 0 || idx >= COUNTDOWN_MAX) return;
  ensureCountdownRow(idx);
  const dateEl = document.getElementById('cdDate' + idx);
  const nameEl = document.getElementById('cdName' + idx);
  if (!dateEl) return;
  const year = parseInt(parts[1], 10) || 0;
  const mon = parseInt(parts[2], 10) || 0;
  const day = parseInt(parts[3], 10) || 0;
  if (mon >= 1 && day >= 1 && year >= 2000) {
    dateEl.value = `${year}-${pad2(mon)}-${pad2(day)}`;
  } else {
    dateEl.value = '';
  }
  if (nameEl) nameEl.value = decodeCdName(parts.slice(4).join(','));
}

function countdownRowBytes(i) {
  return countdownPayloadBytes(i, 6, 'cdDate' + i, 'cdName' + i);
}

function countdownFocusBytes() {
  return countdownPayloadBytes(0x80, 8, 'cdFocusDate', 'cdFocusName');
}

function countdownFieldPair(dateId, nameId) {
  const dateEl = document.getElementById(dateId);
  const nameEl = document.getElementById(nameId);
  const date = (dateEl && dateEl.value) ? dateEl.value.trim() : '';
  const name = (nameEl && nameEl.value) ? nameEl.value.trim() : '';
  return { date, name };
}

async function writeCountdownList() {
  if (!await write(EpdCmd.COUNTDOWN, [0xFF])) return false;
  await sleepMs(20);
  for (let i = 0; i < COUNTDOWN_MAX; i++) {
    const row = countdownFieldPair('cdDate' + i, 'cdName' + i);
    if (!row.date && !row.name) continue;
    if (!await write(EpdCmd.COUNTDOWN, countdownRowBytes(i))) return false;
    await sleepMs(12);
  }
  return true;
}

async function saveCountdown() {
  if (typeof checkBluetoothConnection === 'function' && !checkBluetoothConnection()) return false;
  for (let i = 0; i < COUNTDOWN_MAX; i++) {
    const row = countdownFieldPair('cdDate' + i, 'cdName' + i);
    if (row.name && !row.date) {
      await appAlert(`列表第 ${i + 1} 条请先选择日期`, '事件列表');
      return false;
    }
    if (row.date && !row.name) {
      await appAlert(`列表第 ${i + 1} 条请填写名称`, '事件列表');
      return false;
    }
  }
  try {
    if (!await writeCountdownList()) {
      await appAlert('事件列表发送失败', '事件列表');
      return false;
    }
  } catch (e) {
    if (e && e.code === 'CHAR_NOT_IN_GB2312') {
      await appAlert(`不支持的字符「${e.char}」(须在 GB2312 字库内，请先烧录字库)`, '事件列表');
      return false;
    }
    await appAlert('事件列表发送失败: ' + (e && e.message ? e.message : e), '事件列表');
    return false;
  }
  await sleepMs(80);
  return true;
}

async function clearCountdown() {
  if (typeof checkBluetoothConnection === 'function' && !checkBluetoothConnection()) return;
  if (!await appConfirm('清空全部事件列表？大字倒数日不会改动。确认后会自动刷屏。', '事件列表')) return;
  const nested = typeof calBgUploading !== 'undefined' && calBgUploading;
  if (!nested) {
    calBgUploading = true;
    if (typeof calBgUpdateBusyUi === 'function') calBgUpdateBusyUi();
  }
  try {
    await write(EpdCmd.COUNTDOWN, [0xFF]);
    resetCountdownRows();
    if (typeof calBgRefreshScreen === 'function') await calBgRefreshScreen();
    addLog('已清空事件列表并刷新屏幕');
  } catch (e) {
    addLog('清空事件列表失败: ' + (e && e.message ? e.message : e));
  } finally {
    if (!nested) {
      calBgUploading = false;
      if (typeof calBgUpdateBusyUi === 'function') calBgUpdateBusyUi();
    }
  }
}

async function deleteCountdownRow(i) {
  const n = countdownRowCount();
  if (i < 0 || i >= n) return;
  const row = countdownFieldPair('cdDate' + i, 'cdName' + i);
  if (row.date || row.name) {
    if (!await appConfirm(`删除第 ${i + 1} 条？`, '事件列表')) return;
  } else if (n <= 1) {
    return;
  }
  const items = collectCountdownItems().filter((_, idx) => idx !== i);
  fillCountdownItems(items);
  if (typeof updateButtonStatus === 'function') updateButtonStatus();
  addLog(`已删除第 ${i + 1} 条，点「存储并更新屏幕」写入并刷屏`);
}

async function uploadHzkFlash() {
  if (typeof checkBluetoothConnection === 'function' && !checkBluetoothConnection()) return;
  const input = document.getElementById('hzkBinFile');
  if (!input || !input.files || !input.files[0]) {
    addLog('请先选择字库 bin 文件（与 EPD-nRF5-text 相同的 HZK12）');
    return;
  }
  const buf = new Uint8Array(await input.files[0].arrayBuffer());
  if (buf.length < 24 || (buf.length % 24) !== 0) {
    addLog(`HZK 大小无效: ${buf.length}（须为 24 字节/字的整数倍）`);
    return;
  }
  if (buf.length > 0x30000) {
    addLog('HZK 超过 192KB 保留区');
    return;
  }
  if (typeof uploadFlashPayload !== 'function' || typeof crc32Uint8 !== 'function') {
    addLog('烧录函数不可用');
    return;
  }
  const crc = crc32Uint8(buf);
  try {
    await uploadFlashPayload(buf, buf.length, crc, EpdCmd.HZK_BEGIN, 'hzk=ok', 'GB2312字库', null);
    addLog('字库烧录完成');
    if (typeof imgRefreshInfo === 'function') {
      imgRefreshInfo({ quiet: true }).catch(() => {});
    }
  } catch (e) {
    addLog('字库烧录失败: ' + (e && e.message ? e.message : e));
  }
}

async function eraseSpiFlash() {
  if (typeof checkBluetoothConnection === 'function' && !checkBluetoothConnection()) return;
  if (typeof flashOpActive !== 'undefined' && flashOpActive) {
    addLog('请等待当前 Flash 操作结束');
    return;
  }
  const keepEl = document.getElementById('flashEraseKeepHzk');
  const keep = !!(keepEl && keepEl.checked);
  const warn = keep
    ? '将擦除图片槽和日历区，保留 GB2312 字库。继续？'
    : '将擦除整片 SPI Flash（含字库、图片、日历区）。继续？';
  if (typeof appConfirm === 'function' && !await appConfirm(warn, '擦除 Flash')) return;
  if (typeof waitFlashNotify !== 'function' || typeof setFlashBusy !== 'function') {
    addLog('擦除函数不可用');
    return;
  }
  setFlashBusy(true);
  try {
    addLog(keep ? '开始擦除 Flash（保留字库）' : '开始擦除整片 Flash');
    const p = waitFlashNotify('flash=ok', 180000, 'flash=err', {
      match: (m) => m.startsWith('flash=ok') || m.startsWith('flash=err') ||
                    m.startsWith('flash=busy') || m.startsWith('flash=bad'),
    });
    if (!await write(EpdCmd.FLASH_ERASE, [keep ? 1 : 0])) {
      throw new Error('命令发送失败');
    }
    const r = await p;
    if (!r || !r.startsWith('flash=ok')) throw new Error(r || '擦除失败');
    addLog('Flash 擦除完成');
    if (typeof imgRefreshInfo === 'function') {
      imgRefreshInfo({ quiet: true }).catch(() => {});
    }
  } catch (e) {
    addLog('擦除失败: ' + (e && e.message ? e.message : e));
  } finally {
    setFlashBusy(false);
  }
}

function holidayParseJson(json) {
  if (!json || typeof json !== 'object' || !Array.isArray(json.days)) {
    throw new Error('不是 holiday-cn JSON（需要 year + days[]）');
  }
  const year = parseInt(json.year, 10);
  if (!Number.isFinite(year) || year < 2000 || year > 2099) {
    throw new Error('年份无效');
  }
  const entries = [];
  for (const d of json.days) {
    if (!d || typeof d.date !== 'string') continue;
    const m = d.date.match(/^(\d{4})-(\d{2})-(\d{2})$/);
    if (!m) continue;
    const month = parseInt(m[2], 10);
    const day = parseInt(m[3], 10);
    if (month < 1 || month > 12 || day < 1 || day > 31) continue;
    const work = d.isOffDay ? 0 : 1;
    entries.push((work << 12) | (month << 8) | day);
  }
  if (entries.length === 0) throw new Error('days 为空');
  if (entries.length > 48) throw new Error('条目超过 48 天');
  return { year, entries };
}

function applyHolidayStatus(msg) {
  const el = document.getElementById('holidayStatus');
  if (!el) return;
  const m = /^holiday=(\d+),(\d+),src=(\w+)/.exec(msg);
  if (!m) return;
  const src = m[3] === 'user' ? '上位机导入' : '固件默认';
  el.textContent = `调休数据：${m[1]} 年，${m[2]} 天（${src}）`;
  const y = document.getElementById('holidayYear');
  if (y && !y.matches(':focus')) y.value = m[1];
}

async function holidaySendEntries(year, entries) {
  if (!checkBluetoothConnection()) return;
  const mtu = parseInt(document.getElementById('mtusize')?.value, 10) || 20;
  const maxEntries = Math.max(1, Math.floor((mtu - 5) / 2));
  addLog(`正在发送 ${year} 年调休 ${entries.length} 天…`);
  for (let idx = 0; idx < entries.length; idx += maxEntries) {
    const chunk = entries.slice(idx, idx + maxEntries);
    const payload = [year & 0xFF, (year >> 8) & 0xFF, entries.length & 0xFF, idx & 0xFF];
    for (const e of chunk) {
      payload.push(e & 0xFF, (e >> 8) & 0xFF);
    }
    if (!await write(EpdCmd.HOLIDAY, payload, true)) {
      addLog('调休发送失败');
      return;
    }
  }
  addLog('调休数据已写入，正在刷新日历…');
  await syncTime(1);

function convertUC8159(blackWhiteData, redWhiteData) {
  const halfLength = blackWhiteData.length;
  const payloadData = new Uint8Array(halfLength * 4);
  let payloadIdx = 0;
  for (let i = 0; i < halfLength; i++) {
    let black_data = blackWhiteData[i];
    let color_data = redWhiteData[i];
    for (let j = 0; j < 8; j++) {
      let data;
      if ((color_data & 0x80) === 0x00) data = 0x04;
      else if ((black_data & 0x80) === 0x00) data = 0x00;
      else data = 0x03;
      data = (data << 4) & 0xFF;
      black_data = (black_data << 1) & 0xFF;
      color_data = (color_data << 1) & 0xFF;
      j++;
      if ((color_data & 0x80) === 0x00) data |= 0x04;
      else if ((black_data & 0x80) === 0x00) data |= 0x00;
      else data |= 0x03;
      black_data = (black_data << 1) & 0xFF;
      color_data = (color_data << 1) & 0xFF;
      payloadData[payloadIdx++] = data;
    }
  }
  return payloadData;
}

async function sendimg() {
  if (cropManager.isCropMode()) {
    await appAlert('请先完成图片裁剪！发送已取消。\n放大并移动图片使其充满画布，然后点击「完成」。', '需要裁剪');
    return;
  }

  const canvasSize = document.getElementById('canvasSize').value;
  const ditherMode = document.getElementById('ditherMode').value;
  const epdDriverSelect = document.getElementById('epddriver');
  const selectedOption = epdDriverSelect.options[epdDriverSelect.selectedIndex];

  if (selectedOption.getAttribute('data-size') !== canvasSize) {
    if (!await appConfirm('画布尺寸和驱动不匹配，是否继续？', '警告')) return;
  }
  if (selectedOption.getAttribute('data-color') !== ditherMode) {
    if (!await appConfirm('颜色模式和驱动不匹配，是否继续？', '警告')) return;
  }

  startTime = new Date().getTime();
  epdSending = true;
  const status = document.getElementById("status");
  status.parentElement.style.display = "block";

  const imageData = imageDataForPanel(ctx.getImageData(0, 0, canvas.width, canvas.height));
  const processedData = processImageData(imageData, ditherMode);

  updateButtonStatus(true);

  try {
    await write(EpdCmd.INIT);
    await ensureImageMtuReady(5000);

    let ok = true;
    const uc8159 = ['08', '09', '0e', '0f'].includes(epdDriverSelect.value);
    if (ditherMode === 'threeColor') {
      const halfLength = Math.floor(processedData.length / 2);
      const blackWhiteData = processedData.slice(0, halfLength);
      const redWhiteData = processedData.slice(halfLength);
      if (uc8159) {
        ok = await writeImage(convertUC8159(blackWhiteData, redWhiteData), 'bw');
      } else {
        ok = await writeImage(blackWhiteData, 'bw');
        if (ok) ok = await writeImage(redWhiteData, 'red');
      }
    } else if (ditherMode === 'blackWhiteColor') {
      if (uc8159) {
        const emptyData = new Uint8Array(processedData.length).fill(0xFF);
        ok = await writeImage(convertUC8159(processedData, emptyData), 'bw');
      } else {
        ok = await writeImage(processedData, 'bw');
      }
    } else if (ditherMode === 'fourColor') {
      ok = await writeImage(processedData, 'bw');
    } else {
      addLog("当前固件不支持此颜色模式。");
      return;
    }
    if (!ok) {
      addLog("传图中断（蓝牙写入失败）");
      return;
    }

    await write(EpdCmd.REFRESH);
    const sendTime = (new Date().getTime() - startTime) / 1000.0;
    addLog(`发送完成！耗时: ${sendTime}s`);
    setStatus(`发送完成！耗时: ${sendTime}s`);
    addLog("屏幕刷新完成前请不要操作。");
    /* Do not hide status.parentElement: xferBar lives in the same bar.
     * Hiding it after direct send makes later slot uploads look like they
     * have no progress (bar.hidden=false but parent is display:none). */
  } finally {
    epdSending = false;
    updateButtonStatus();
  }
}

async function downloadDataArray() {
  if (cropManager.isCropMode()) {
    await appAlert('请先完成图片裁剪！下载已取消。\n放大并移动图片使其充满画布，然后点击「完成」。', '需要裁剪');
    return;
  }

  const mode = document.getElementById('ditherMode').value;
  const imageData = imageDataForPanel(ctx.getImageData(0, 0, canvas.width, canvas.height));
  const processedData = processImageData(imageData, mode);

  if (mode === 'sixColor' && processedData.length !== imageData.width * imageData.height) {
    console.log(`错误：预期${imageData.width * imageData.height}字节，但得到${processedData.length}字节`);
    addLog('数组大小不匹配。请检查图像尺寸和模式。');
    return;
  }

  const dataLines = [];
  for (let i = 0; i < processedData.length; i++) {
    const hexValue = (processedData[i] & 0xff).toString(16).padStart(2, '0');
    dataLines.push(`0x${hexValue}`);
  }

  const formattedData = [];
  for (let i = 0; i < dataLines.length; i += 16) {
    formattedData.push(dataLines.slice(i, i + 16).join(', '));
  }

  const colorModeValue = mode === 'sixColor' ? 0 : mode === 'fourColor' ? 1 : mode === 'blackWhiteColor' ? 2 : 3;
  const arrayContent = [
    'const uint8_t imageData[] PROGMEM = {',
    formattedData.join(',\n'),
    '};',
    `const uint16_t imageWidth = ${imageData.width};`,
    `const uint16_t imageHeight = ${imageData.height};`,
    `const uint8_t colorMode = ${colorModeValue};`
  ].join('\n');

  const blob = new Blob([arrayContent], { type: 'text/plain' });
  const link = document.createElement('a');
  link.download = 'imagedata.h';
  link.href = URL.createObjectURL(blob);
  link.click();
  URL.revokeObjectURL(link.href);
}
